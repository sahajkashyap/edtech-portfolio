<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Assessment Tracker</title>
<!-- html2canvas used to be loaded here on every single page view and was never
     called anywhere in this file. A script nobody uses is still a request out to
     the internet from a classroom laptop, so it is gone. jsPDF below is the only
     thing this tool fetches, and exportPDF() now says so plainly when it cannot
     be reached. Nothing in this file ever sends anything anywhere. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body style="margin: 0; padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: transparent;">

<style>
  :root {
    --color-text-primary: #2c3e50;
    --color-text-secondary: #7f8c8d;
    --color-background-primary: #FBF9F7;
    --color-background-secondary: #F3EFE7;
    --color-border-primary: #378ADD;
    --color-border-secondary: #D4C5B9;
    --color-border-tertiary: #E8DDD4;
  }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem; background: #E8D4C4; }
  .container { max-width: 1400px; margin: 0 auto; }

  .header { margin-bottom: 1rem; display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap; }
  .header h1 { margin: 0; font-size: 24px; font-weight: 600; color: var(--color-text-primary); }
  .header .what { font-size: 13px; color: var(--color-text-secondary); }
  .who label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .who input { padding: 8px 10px; border: 1px solid var(--color-border-secondary); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--color-background-primary); color: var(--color-text-primary); }
  #initials { width: 84px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
  .privacy { margin-left: auto; font-size: 12.5px; color: var(--color-text-secondary); font-weight: bold; }

  /* The sample student. She is labelled everywhere she appears — on screen and
     in every export — so a printed sheet can never be mistaken for a real
     child's record. */
  .sample-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; padding: 10px 14px; background: #FFF6E0; border: 1px solid #E3C87A; border-radius: 10px; font-size: 13px; color: var(--color-text-primary); }
  .sample-strip.plain { background: var(--color-background-secondary); border-color: var(--color-border-tertiary); }

  .msg { min-height: 18px; margin: 0 0 1rem 0; font-size: 13px; font-weight: 600; color: #9B3A17; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* "Nothing is being saved" gets its own bar and stays in it. It used to go
     through the one shared message line, where the next ordinary message
     painted straight over it. */
  .storagewarn { display: none; margin-bottom: 1rem; padding: 10px 14px; border-radius: 8px;
                 background: #FDECEA; border: 2px solid #B3261E; color: #7A1710;
                 font-size: 13px; font-weight: 700; }
  .storagewarn.show { display: block; }

  .top-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }

  .box { padding: 1.5rem; background: var(--color-background-secondary); border-radius: 12px; border: 0.5px solid var(--color-border-tertiary); }
  .box-title { font-size: 15px; font-weight: 700; color: var(--color-text-secondary); margin: 0 0 1rem 0; text-transform: uppercase; letter-spacing: 0.5px; }

  .chart-area { background: var(--color-background-primary); border-radius: 8px; padding: 1rem; border: 0.5px solid var(--color-border-tertiary); margin-bottom: 1rem; }
  #pieChart { width: 100%; height: 160px; cursor: pointer; }

  .counts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .count-num { font-size: 18px; font-weight: 700; margin: 0; }
  .count-label { font-size: 11px; font-weight: 600; text-transform: uppercase; margin: 4px 0 0 0; color: var(--color-text-secondary); }

  select { width: 100%; padding: 12px 14px; border: 1px solid var(--color-border-secondary); border-radius: 8px; font-size: 16px; font-weight: 500; background: var(--color-background-primary); color: var(--color-text-primary); margin-bottom: 1rem; cursor: pointer; }

  .lessons { display: grid; gap: 10px; max-height: 350px; overflow-y: auto; }
  .lesson { padding: 10px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
  .lesson-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .lesson-unit { font-size: 11px; color: var(--color-text-secondary); display: block; margin-top: 2px; }
  .empty { font-size: 13px; color: var(--color-text-secondary); margin: 0; padding: 10px 2px; }

  .score-buttons { display: flex; gap: 6px; }
  .btn-score { padding: 6px 10px; font-size: 11px; font-weight: 500; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); color: var(--color-text-primary); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .btn-score:hover { border-color: var(--color-border-secondary); background: var(--color-background-secondary); }
  .btn-score.e { background: #378ADD; border-color: #378ADD; color: white; }
  .btn-score.d { background: #BA7517; border-color: #BA7517; color: white; }
  .btn-score.m { background: #639922; border-color: #639922; color: white; }

  .section { margin: 1.5rem 0; padding: 1.5rem; background: var(--color-background-secondary); border-radius: 12px; border: 0.5px solid var(--color-border-tertiary); }
  .section-title { font-size: 15px; font-weight: 700; color: var(--color-text-secondary); margin: 0 0 1rem 0; text-transform: uppercase; letter-spacing: 0.5px; }

  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #A0D4E8;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #E3F2FD;
    color: var(--color-text-primary);
  }
  textarea:focus {
    outline: none;
    border-color: #378ADD;
    background: #E3F2FD;
  }
  textarea { resize: vertical; min-height: 80px; }

  .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .two-column { grid-template-columns: 1fr; } }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }

  button { padding: 10px 16px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); border-radius: 6px; cursor: pointer; transition: 0.2s; }
  button:hover { background: var(--color-background-secondary); }

  .btn-primary { background: #378ADD; border-color: #378ADD; color: white; font-weight: 500; }
  .btn-primary:hover { background: #2966bb; }

  /* The three tiles are real <button>s now: they were DIVs with a click
     handler, so Tab never reached them and Enter did nothing — the breakdown
     could only be opened with a mouse. These rules sit AFTER the generic
     button rules above on purpose, or the plain button styling would repaint
     the colours the tiles use to mean something. */
  .count-item { padding: 10px; text-align: center; border-radius: 8px; border: 0.5px solid; cursor: pointer; transition: all 0.2s; font-family: inherit; width: 100%; }
  .count-item:hover { transform: scale(1.05); }
  .count-item.e, .count-item.e:hover { background: rgba(55, 138, 221, 0.1); border-color: #378ADD; }
  .count-item.d, .count-item.d:hover { background: rgba(186, 117, 23, 0.1); border-color: #BA7517; }
  .count-item.m, .count-item.m:hover { background: rgba(99, 153, 34, 0.1); border-color: #639922; }
  .count-item.e .count-num { color: #378ADD; }
  .count-item.d .count-num { color: #BA7517; }
  .count-item.m .count-num { color: #639922; }

  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
  .modal.show { display: block; }
  .modal-content { background: var(--color-background-secondary); margin: 5% auto; padding: 2rem; border-radius: 12px; border: 1px solid var(--color-border-secondary); width: 90%; max-width: 600px; max-height: 70vh; overflow-y: auto; }
  /* A real <button> now, painted back to the plain × it always looked like.
     These rules sit after the generic button rules on purpose. */
  .close-modal { float: right; font-size: 24px; font-weight: bold; cursor: pointer; color: var(--color-text-secondary);
                 background: transparent; border: none; padding: 0 4px; line-height: 1; font-family: inherit; }
  .close-modal:hover { color: var(--color-text-primary); background: transparent; }
  .close-modal:focus-visible { outline: 2px solid var(--color-border-primary); outline-offset: 2px; border-radius: 4px; }
  .modal-title { font-size: 18px; font-weight: 700; margin: 0 0 1.5rem 0; color: var(--color-text-primary); }
  .lesson-item { padding: 12px; margin-bottom: 10px; background: var(--color-background-primary); border-radius: 8px; border-left: 4px solid; }
  .lesson-item.e { border-color: #378ADD; }
  .lesson-item.d { border-color: #BA7517; }
  .lesson-item.m { border-color: #639922; }
  .lesson-item-name { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
  .lesson-item-skill { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }

  /* On a phone the two top boxes stayed side by side with no media query at
     all, so the whole right-hand card — the unit picker and every lesson row —
     sat past the edge of the screen with no hint it was there. A visitor saw an
     empty chart, three zeroes, and no way to score anything. */
  @media (max-width: 820px) {
    body { padding: 1rem; }
    .top-boxes { grid-template-columns: 1fr; gap: 1.25rem; }
    .header { gap: 1rem; }
    .privacy { margin-left: 0; width: 100%; }
    .counts { gap: 8px; }
    .count-label { font-size: 10px; }
  }
</style>

<div class="container">

  <div class="header">
    <div>
      <h1>Math Assessment Tracker</h1>
      <span class="what">Unit by unit, for grade 1&#8211;2 teachers</span>
    </div>
    <div class="who">
      <label for="initials">Child</label>
      <input type="text" id="initials" maxlength="4" placeholder="J.M." autocomplete="off">
    </div>
    <div class="who">
      <label for="adate">Date</label>
      <input type="date" id="adate">
    </div>
    <div class="privacy">&#9679; Stays on this laptop</div>
  </div>

  <!-- SAMPLE STUDENT -->
  <div class="sample-strip plain" id="sampleStrip">
    <span id="sampleText">New here? Fill the tool with a made-up student so you can see what it does.</span>
    <button type="button" id="sampleBtn" onclick="loadSample()">Try it with a sample student</button>
  </div>

  <div class="storagewarn" id="storageWarn" role="alert"></div>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <!-- TOP: GRAPH AND LESSONS SIDE BY SIDE -->
  <div class="top-boxes">

    <!-- LEFT: DISTRIBUTION GRAPH -->
    <div class="box">
      <div class="box-title">Distribution</div>
      <div class="chart-area">
        <svg id="pieChart" role="img" aria-label="Distribution of scores"></svg>
      </div>
      <div class="counts">
        <button type="button" class="count-item e" onclick="showLessonsByScore('e')">
          <p class="count-num" id="count-e">0</p>
          <p class="count-label">Emerging / Beginning</p>
        </button>
        <button type="button" class="count-item d" onclick="showLessonsByScore('d')">
          <p class="count-num" id="count-d">0</p>
          <p class="count-label">Developing</p>
        </button>
        <button type="button" class="count-item m" onclick="showLessonsByScore('m')">
          <p class="count-num" id="count-m">0</p>
          <p class="count-label">Mastered</p>
        </button>
      </div>
    </div>

    <!-- RIGHT: SELECT UNIT + LESSONS -->
    <div class="box">
      <div class="box-title">Select Unit</div>
      <select id="unitSelect" onchange="updateLessons(); saveState();">
        <option value="">Choose a unit...</option>
        <option value="all">All Lessons</option>
      </select>
      <div class="lessons" id="lessonsList"></div>
    </div>

  </div>

  <!-- COMMENTS -->
  <div class="section">
    <div class="two-column">
      <div>
        <label for="strengthsComment">Strengths</label>
        <textarea id="strengthsComment" placeholder="What is this student doing well in math?"></textarea>
      </div>
      <div>
        <label for="stretchesComment">Stretches: Areas of Growth</label>
        <textarea id="stretchesComment" placeholder="What are the challenges or areas where they need more practice?"></textarea>
      </div>
    </div>
  </div>

  <!-- MODAL FOR FILTERED LESSONS -->
  <div id="lessonsModal" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <!-- The × was a <span>: no Tab ever reached it, Escape did nothing, and a
           keyboard-only teacher who opened this list could not get rid of it. -->
      <button type="button" class="close-modal" id="closeModalBtn" aria-label="Close this list" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalTitle">Emerging / Beginning Lessons</div>
      <div id="modalLessonsList"></div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="section" style="display: flex; gap: 8px; flex-wrap: wrap;">
    <button class="btn-primary" onclick="exportPDF()">Export PDF</button>
    <button onclick="exportJSON()">Export JSON</button>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="clearForm()">Clear</button>
    <button id="undoClearBtn" hidden onclick="undoClear()">Undo the clear</button>
  </div>

</div>

<script>
// Lesson names used to be raw planning shorthand — "1-7 1st graph",
// "7-8 Math Journal 186 187", "2-7 cont" — which meant nothing to anyone but
// the person who typed them, and they went straight into the CSV, the JSON and
// the PDF a family reads. "Tally Marks" and "tally mark" were also two separate
// scorable rows in the same unit, so the same child could be Emerging on one
// and Mastered on the other. Names are readable now and the duplicate is gone.
// Two units were also renamed to match what is actually inside them.
const curriculum = {
  "Graphing & Data": ["Reading a Bar Graph", "Making a Bar Graph", "Sorting and Counting Data", "Tally Marks", "Asking Questions About a Graph"],
  "Number Sense & Place Value": ["Counting on the Number Grid", "Coloring Patterns on the Number Grid", "Number Line", "Equivalent Names for Numbers", "Skip Counting Patterns", "Comparing Numbers", "Doubles and Combinations of 10", "Making 10 Strategies", "Near Doubles Strategy", "Name Collection Boxes", "Name That Number", "Frames and Arrows", "Fact Families", "Counting Up and Counting Back to Subtract", "Using Place Value to Compare Numbers", "Showing Numbers with Base-Ten Blocks", "Playing Salute", "What's My Rule"],
  "Measurement & Shapes": ["Measuring with Non-Standard Units", "Measuring in Inches", "Measuring in Centimeters", "Measuring in Meters", "Measuring in Yards", "Sorting Shapes", "Drawing and Reasoning About Quadrilaterals", "Attributes of 3D Shapes"],
  "Addition & Number Stories": ["Addition Number Stories", "Addition Number Stories: More Practice", "Change-to-More Number Stories", "Parts-and-Total Number Stories", "Change Number Stories", "Comparison Number Stories", "Interpreting Number Stories", "Animal Number Stories", "Two-Step Number Stories", "Equal Groups and Array Number Stories", "Equal Groups and Arrays", "Playing Array Concentration", "Multiples of 10 and 5 with Coins"],
  "Addition, Subtraction & Money": ["Place Value Review", "Partial Sums Addition", "Adding Several Numbers", "Playing Basketball Addition", "Subtraction with Base-Ten Blocks", "Expand and Trade Subtraction, Part 1", "Expand and Trade Subtraction, Part 2", "Using Coins to Buy Things", "Counting Up with Money", "Coin Calculations", "Equivalent Money Amounts", "Estimating Costs"]
};

const LEVELS = { e: 'Emerging', d: 'Developing', m: 'Mastered' };
const LEVEL_NAMES = { e: 'Emerging / Beginning', d: 'Developing', m: 'Mastered' };

const scores = {};
let currentUnit = "";
let isSample = false;       // true while the made-up student is on screen
let lastCleared = null;     // what Clear threw away, so it can be put back
let sampleNudged = false;   // the "clear the sample first" line is said once
let modalOpener = null;     // what to put the keyboard back on when the list closes

const el = id => document.getElementById(id);

// ---------------------------------------------------------------------------
// The sample student. Made up, named, and labelled everywhere she shows up.
// Her profile is deliberately mixed — strong in number sense, shaky with money
// and two-step stories, and a handful of lessons not assessed yet — because a
// child who scores the same on everything shows a visitor nothing about what
// the tool is for.
// ---------------------------------------------------------------------------
const SAMPLE_NAME = 'Maya Torres';
const SAMPLE_INITIALS = 'M.T.';
const SAMPLE_LABEL = 'Sample student — ' + SAMPLE_NAME + ' (made-up scores, not a real child)';
const SAMPLE_SCORES = {
  "Reading a Bar Graph": "Mastered",
  "Making a Bar Graph": "Developing",
  "Sorting and Counting Data": "Mastered",
  "Tally Marks": "Mastered",
  "Asking Questions About a Graph": "Developing",
  "Counting on the Number Grid": "Mastered",
  "Coloring Patterns on the Number Grid": "Mastered",
  "Number Line": "Mastered",
  "Equivalent Names for Numbers": "Developing",
  "Skip Counting Patterns": "Mastered",
  "Comparing Numbers": "Mastered",
  "Doubles and Combinations of 10": "Mastered",
  "Making 10 Strategies": "Mastered",
  "Near Doubles Strategy": "Developing",
  "Name Collection Boxes": "Developing",
  "Frames and Arrows": "Developing",
  "Fact Families": "Mastered",
  "Counting Up and Counting Back to Subtract": "Developing",
  "Using Place Value to Compare Numbers": "Mastered",
  "Showing Numbers with Base-Ten Blocks": "Mastered",
  "What's My Rule": "Developing",
  "Measuring with Non-Standard Units": "Mastered",
  "Measuring in Inches": "Mastered",
  "Measuring in Centimeters": "Developing",
  "Measuring in Meters": "Emerging",
  "Sorting Shapes": "Mastered",
  "Drawing and Reasoning About Quadrilaterals": "Developing",
  "Attributes of 3D Shapes": "Emerging",
  "Addition Number Stories": "Mastered",
  "Change-to-More Number Stories": "Developing",
  "Parts-and-Total Number Stories": "Developing",
  "Comparison Number Stories": "Emerging",
  "Two-Step Number Stories": "Emerging",
  "Equal Groups and Array Number Stories": "Emerging",
  "Place Value Review": "Mastered",
  "Partial Sums Addition": "Developing",
  "Adding Several Numbers": "Developing",
  "Subtraction with Base-Ten Blocks": "Developing",
  "Expand and Trade Subtraction, Part 1": "Emerging",
  "Expand and Trade Subtraction, Part 2": "Emerging",
  "Using Coins to Buy Things": "Developing",
  "Counting Up with Money": "Emerging",
  "Coin Calculations": "Emerging",
  "Estimating Costs": "Emerging"
};
const SAMPLE_STRENGTHS = "Maya counts on without going back to one, and she knows her doubles and her ways to make ten straight away. She explains how she got an answer, and when a bar graph is in front of her she checks it against the question before she answers.";
const SAMPLE_STRETCHES = "Money is the sticking point. She names the coins fine but loses track once she has to add them, and change is still a guess. Two-step stories need a second read before she starts, and trading in subtraction is not there yet.";

// ---------------------------------------------------------------------------
// One place to talk to the teacher, so every path that gives up says why.
// ---------------------------------------------------------------------------
function say(text, ms) {
  const m = el('msg');
  m.textContent = text;
  if (ms) setTimeout(() => { if (m.textContent === text) m.textContent = ''; }, ms);
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function initUnits() {
  const select = el('unitSelect');
  Object.keys(curriculum).forEach(unit => {
    const option = document.createElement('option');
    option.value = unit;
    option.textContent = unit;
    select.appendChild(option);
  });
}

function updateLessons() {
  currentUnit = el('unitSelect').value;
  const list = el('lessonsList');
  // Re-rendering the whole list after every click used to jump a 56-row list
  // back to the top, so scoring down a unit meant scrolling back each time.
  const keepScroll = list.scrollTop;
  list.innerHTML = '';

  if (!currentUnit) {
    // The first screen used to be two large empty boxes, which reads as broken
    // rather than as waiting for you.
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Choose a unit above to start scoring.';
    list.appendChild(p);
    return;
  }

  let lessonsToShow = [];

  if (currentUnit === 'all') {
    Object.entries(curriculum).forEach(([unit, lessons]) => {
      lessons.forEach(lesson => {
        lessonsToShow.push({ lesson, unit });
      });
    });
  } else {
    curriculum[currentUnit].forEach(lesson => {
      lessonsToShow.push({ lesson, unit: currentUnit });
    });
  }

  lessonsToShow.forEach(({ lesson, unit }) => {
    scores[lesson] = scores[lesson] || null;
    const row = document.createElement('div');
    row.className = 'lesson';

    const nameWrap = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'lesson-name';
    name.textContent = lesson;
    nameWrap.appendChild(name);
    if (currentUnit === 'all') {
      const u = document.createElement('span');
      u.className = 'lesson-unit';
      u.textContent = unit;
      nameWrap.appendChild(u);
    }
    row.appendChild(nameWrap);

    // Built with real elements and a real listener. The buttons used to be
    // written into innerHTML with the lesson name pasted into an onclick
    // string, escaped by hand — one apostrophe away from a broken row.
    [['E', 'Emerging', 'e'], ['D', 'Developing', 'd'], ['M', 'Mastered', 'm']].forEach(([letter, level, cls]) => {
      const b = document.createElement('button');
      b.type = 'button';
      const on = scores[lesson] === level;
      b.className = 'btn-score' + (on ? ' ' + cls : '');
      b.textContent = letter;
      b.title = on ? level + ' — click again to un-score this lesson' : level;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', lesson + ': ' + level);
      b.addEventListener('click', () => setScore(lesson, level));
      row.appendChild(b);
    });

    list.appendChild(row);
  });

  list.scrollTop = keepScroll;
}

function setScore(lesson, level) {
  // updateLessons() below empties the list and builds every row again, which
  // threw the keyboard's place away: after pressing Enter on E, focus was back
  // on the body, a second Enter did nothing, and getting to that same button
  // again took eight tab stops — after every single score. So remember which
  // button was under the keyboard and put focus back on it once the row has
  // been rebuilt. Matched on the aria-label rather than a CSS selector because
  // lesson names contain apostrophes ("What's My Rule").
  const active = document.activeElement;
  const refocus = active && active.classList && active.classList.contains('btn-score')
                  ? active.getAttribute('aria-label') : null;

  // Clicking the level a lesson already has now takes it back off. A mis-click
  // used to be permanent — the second click was a no-op and the only way out
  // was Clear, which wiped the entire assessment.
  scores[lesson] = (scores[lesson] === level) ? null : level;
  updateLessons();

  if (refocus) {
    const again = Array.from(el('lessonsList').querySelectorAll('.btn-score'))
                       .find(b => b.getAttribute('aria-label') === refocus);
    if (again) again.focus();
  }

  updateCharts();
  saveState();
}

function countScores() {
  const counts = { e: 0, d: 0, m: 0 };
  // Only lessons that are still in the curriculum count. A saved file from an
  // older version can carry lesson names that no longer exist, and those used
  // to quietly inflate the totals and the pie.
  Object.entries(scores).forEach(([lesson, score]) => {
    if (!lessonExists(lesson)) return;
    if (score === 'Emerging') counts.e++;
    else if (score === 'Developing') counts.d++;
    else if (score === 'Mastered') counts.m++;
  });
  return counts;
}

function lessonExists(lesson) {
  return Object.values(curriculum).some(lessons => lessons.indexOf(lesson) !== -1);
}

function updateCharts() {
  drawPieChart();
  updateCounts();
}

function updateCounts() {
  const counts = countScores();
  el('count-e').textContent = counts.e;
  el('count-d').textContent = counts.d;
  el('count-m').textContent = counts.m;
}

function drawPieChart() {
  const counts = countScores();
  const total = counts.e + counts.d + counts.m;
  const svg = el('pieChart');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 280 160');
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

  const radius = 50;
  const cx = 70, cy = 80;
  const colors = { e: '#378ADD', d: '#BA7517', m: '#639922' };
  const order = ['e', 'd', 'm'];

  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
    return n;
  };

  if (total === 0) {
    // Nothing scored yet. The chart was simply blank here — an SVG with no
    // viewBox rendering as a white rectangle, which looks like a page that
    // failed to load rather than one waiting for you.
    svg.appendChild(svgEl('circle', {
      cx: cx, cy: cy, r: radius, fill: 'none',
      stroke: '#D4C5B9', 'stroke-width': '2', 'stroke-dasharray': '5 5'
    }));
    const t = svgEl('text', { x: 150, y: 84, 'font-size': '12', fill: '#7f8c8d' });
    t.textContent = 'No scores yet';
    svg.appendChild(t);
    svg.setAttribute('aria-label', 'No scores yet');
    return;
  }

  let startAngle = -Math.PI / 2;

  order.forEach(key => {
    const value = counts[key];
    if (value === 0) return;

    let shape;
    if (value === total) {
      // Every scored lesson in one band. The arc maths gives a start point and
      // an end point in exactly the same place, and SVG draws nothing at all
      // for that — so a real, perfectly ordinary reading (a child Emerging on
      // everything you have assessed so far, or the very first click anyone
      // makes) produced an empty chart. One band is a whole circle.
      shape = svgEl('circle', { cx: cx, cy: cy, r: radius });
    } else {
      const sliceAngle = (value / total) * 2 * Math.PI;
      const endAngle = startAngle + sliceAngle;

      const x1 = cx + radius * Math.cos(startAngle);
      const y1 = cy + radius * Math.sin(startAngle);
      const x2 = cx + radius * Math.cos(endAngle);
      const y2 = cy + radius * Math.sin(endAngle);

      const largeArc = sliceAngle > Math.PI ? 1 : 0;
      shape = svgEl('path', {
        d: `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`
      });
      startAngle = endAngle;
    }

    shape.setAttribute('fill', colors[key]);
    shape.setAttribute('stroke', 'white');
    shape.setAttribute('stroke-width', '2');
    shape.style.cursor = 'pointer';
    shape.onclick = () => showLessonsByScore(key);
    svg.appendChild(shape);
  });

  // A legend. The chart had three coloured wedges and no text of any kind, so
  // the only way to know which colour meant what was the tiles underneath.
  let ly = 48;
  const parts = [];
  order.forEach(key => {
    const value = counts[key];
    const pct = Math.round((value / total) * 100);
    parts.push(LEVEL_NAMES[key] + ' ' + value);
    svg.appendChild(svgEl('rect', { x: 140, y: ly - 9, width: 10, height: 10, rx: 2, fill: colors[key] }));
    const t = svgEl('text', { x: 156, y: ly, 'font-size': '11', fill: '#2c3e50' });
    // The short level name, not the full one: on a phone the chart is scaled
    // to the width of the screen and anything past the viewBox is cut off, so
    // "Emerging / Beginning — 10 (23%)" lost its own numbers off the edge.
    t.textContent = LEVELS[key] + ' — ' + value + ' (' + pct + '%)';
    svg.appendChild(t);
    ly += 22;
  });
  svg.setAttribute('aria-label', 'Distribution of ' + total + ' scored lessons: ' + parts.join(', '));
}

function showLessonsByScore(scoreLevel) {
  const lessonsByUnit = {};

  Object.entries(curriculum).forEach(([unitName, lessons]) => {
    const atLevel = [];

    lessons.forEach(lesson => {
      if (scores[lesson] === LEVELS[scoreLevel]) {
        atLevel.push(lesson);
      }
    });

    if (atLevel.length > 0) {
      lessonsByUnit[unitName] = atLevel;
    }
  });

  const modal = el('lessonsModal');
  const modalTitle = el('modalTitle');
  const modalList = el('modalLessonsList');

  modalTitle.textContent = `${LEVEL_NAMES[scoreLevel]} Lessons`;
  modalList.innerHTML = '';

  const unitNames = Object.keys(lessonsByUnit);

  if (unitNames.length === 0) {
    modalList.innerHTML = '<p style="color: var(--color-text-secondary);">No lessons at this level.</p>';
  } else {
    unitNames.forEach(unitName => {
      const unitHeader = document.createElement('div');
      unitHeader.style.marginTop = '1rem';
      unitHeader.style.marginBottom = '0.75rem';
      unitHeader.style.paddingBottom = '0.5rem';
      unitHeader.style.borderBottom = '2px solid var(--color-border-secondary)';
      unitHeader.style.fontSize = '14px';
      unitHeader.style.fontWeight = '700';
      unitHeader.style.color = 'var(--color-text-primary)';
      unitHeader.textContent = unitName;
      modalList.appendChild(unitHeader);

      lessonsByUnit[unitName].forEach(lesson => {
        const item = document.createElement('div');
        item.className = `lesson-item ${scoreLevel}`;
        const n = document.createElement('div');
        n.className = 'lesson-item-name';
        n.textContent = lesson;
        item.appendChild(n);
        modalList.appendChild(item);
      });
    });
  }

  modal.classList.add('show');
  // Send the keyboard into the list that just opened, and remember the tile it
  // came from so it can be handed back. Without this, Tab carried on through
  // the unit picker and the score buttons underneath the full-screen overlay.
  modalOpener = document.activeElement;
  el('closeModalBtn').focus();
}

function closeModal() {
  el('lessonsModal').classList.remove('show');
  if (modalOpener && document.body.contains(modalOpener)) modalOpener.focus();
  modalOpener = null;
}

// Escape closes it, and Tab stays inside it. There was no key handler in this
// file at all: a keyboard-only teacher who opened the breakdown had no way out.
document.addEventListener('keydown', function(e) {
  if (!el('lessonsModal').classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab') {
    // The × is the only thing in here to land on, so Tab keeps it there rather
    // than walking off into the page hidden behind the overlay.
    e.preventDefault();
    el('closeModalBtn').focus();
  }
});

window.onclick = function(event) {
  const modal = el('lessonsModal');
  if (event.target === modal) closeModal();
}

// ---------------------------------------------------------------------------
// Saving. localStorage only — nothing in this file goes anywhere near a
// network. Nothing used to be saved at all: a refresh, a closed lid or a
// stray Cmd-R after twenty minutes of assessing lost the lot, with no warning.
// ---------------------------------------------------------------------------
const STORE_KEY = 'math-assessment-tracker';

function currentState() {
  const kept = {};
  Object.entries(scores).forEach(([lesson, score]) => {
    if (score && lessonExists(lesson)) kept[lesson] = score;
  });
  return {
    version: 1,
    visited: true,
    sample: isSample,
    initials: el('initials').value,
    date: el('adate').value,
    unit: currentUnit,
    scores: kept,
    strengths: el('strengthsComment').value,
    stretches: el('stretchesComment').value
  };
}

// The warning lives in its own bar and STAYS there. It used to go through
// say(), the one line every message shares, and it was said once and once only
// — so a single click of Export CSV replaced it with "CSV saved to your
// Downloads folder.", that faded after five seconds, and nothing ever brought
// it back. A teacher carried on scoring into nothing with an empty message line
// and no sign at all that anything was wrong.
const STORAGE_WARNING =
  'THIS ASSESSMENT IS NOT BEING SAVED — this browser refused to store it ' +
  '(a private window, or the disk is full). Nothing on this screen will survive ' +
  'closing the tab. Export it before you close it.';

function warnNotSaving() {
  const bar = el('storageWarn');
  bar.textContent = STORAGE_WARNING;
  bar.classList.add('show');
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(currentState()));
  } catch (err) {
    // A full disk, or Safari's private window, makes setItem throw. With no
    // catch the exception took the rest of the click with it, and a teacher
    // carried on scoring into something that was keeping none of it.
    // Called on every failed write, not just the first: if anything ever hides
    // the bar, the next score puts it straight back.
    warnNotSaving();
  }
}

function readState() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY));
  } catch (err) {
    return null;
  }
}

function applyState(s) {
  if (!s) return;
  el('initials').value = s.initials || '';
  el('adate').value = s.date || todayISO();
  el('strengthsComment').value = s.strengths || '';
  el('stretchesComment').value = s.stretches || '';
  Object.keys(scores).forEach(k => delete scores[k]);
  Object.entries(s.scores || {}).forEach(([lesson, score]) => {
    if (lessonExists(lesson)) scores[lesson] = score;
  });
  isSample = !!s.sample;
  sampleNudged = false;
  el('unitSelect').value = s.unit && (s.unit === 'all' || curriculum[s.unit]) ? s.unit : '';
  paintSampleStrip();
  updateLessons();
  updateCharts();
}

// Every keystroke, not on blur. A comment typed and then exported straight
// away — without clicking anywhere else first — used to be dropped, because
// nothing read the box until it lost focus.
['initials', 'adate', 'strengthsComment', 'stretchesComment'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    // Typing in a box does NOT turn made-up scores into a real record, and the
    // label must not come off for it. It used to: any keystroke in any of
    // these four boxes set isSample to false. Changing only the date — on a
    // page that loads Maya automatically — left her initials and all 44
    // invented scores on screen with the label gone, the banner gone, and
    // exports that read as a genuine record for a child called "M.T.".
    // Clicking a score button never dropped the label either, so this is now
    // consistent: the only ways out of the sample are "Clear the sample" and
    // Clear, and both of them take her scores with them.
    if (isSample) nudgeToClearSample();
    saveState();
  });
});

// Said once, not on every keystroke, so it does not nag while somebody types.
function nudgeToClearSample() {
  if (sampleNudged) return;
  sampleNudged = true;
  // The old wording sent a teacher to a button that wiped everything they had
  // just typed without a word. It asks first now, and this says so.
  say('These are still Maya’s made-up scores, so this stays marked as the sample. ' +
      'Press “Clear the sample” above to empty the tool for a real assessment — it asks first, ' +
      'and "Undo the clear" puts your work back.', 12000);
}

// ---------------------------------------------------------------------------
// The sample student
// ---------------------------------------------------------------------------

// Both buttons on the sample strip replace everything on screen in one click.
// Neither one used to ask, and neither one kept what it threw away — so "Try it
// with a sample student", sitting at the top of the page next to the child's
// initials, wiped a real assessment in progress and put Maya's 44 made-up
// scores in its place, and "Clear the sample" — which the nudge below tells a
// teacher to press — wiped everything typed on top of her. The plain Clear
// button has asked first and offered an Undo for months; these two now do the
// same. What is on screen is only safe to throw away if it is the sample
// exactly as it was loaded, or nothing at all.
function sameAsSampleScores() {
  const keys = Object.keys(SAMPLE_SCORES);
  const scored = Object.keys(scores).filter(k => scores[k]);
  if (scored.length !== keys.length) return false;
  return keys.every(k => scores[k] === SAMPLE_SCORES[k]);
}

function untouchedSample() {
  // The date is left out on purpose: today's date typed over today's date is
  // not a morning's work, and stopping to ask about it would train a teacher
  // to click through the question that matters.
  return isSample &&
         el('initials').value === SAMPLE_INITIALS &&
         el('strengthsComment').value === SAMPLE_STRENGTHS &&
         el('stretchesComment').value === SAMPLE_STRETCHES &&
         sameAsSampleScores();
}

function workOnScreen() {
  if (untouchedSample()) return false;
  return Object.values(scores).some(Boolean) ||
         el('initials').value.trim() !== '' ||
         el('strengthsComment').value.trim() !== '' ||
         el('stretchesComment').value.trim() !== '';
}

// Same drawer Clear uses, so one "Undo the clear" button puts back whatever
// was last taken away, whichever button took it.
function stashForUndo() {
  lastCleared = currentState();
  el('undoClearBtn').hidden = false;
}

function paintSampleStrip() {
  const strip = el('sampleStrip');
  const text = el('sampleText');
  const btn = el('sampleBtn');
  if (isSample) {
    strip.classList.remove('plain');
    text.innerHTML = '<strong>Sample student — ' + SAMPLE_NAME + '.</strong> ' +
      'Made-up scores, so you can see the tool with something in it. This is not a real child, ' +
      'and every export says so.';
    btn.textContent = 'Clear the sample';
    btn.setAttribute('onclick', 'clearSample()');
  } else {
    strip.classList.add('plain');
    text.textContent = 'New here? Fill the tool with a made-up student so you can see what it does.';
    btn.textContent = 'Try it with a sample student';
    btn.setAttribute('onclick', 'loadSample()');
  }
}

function loadSample() {
  const replacing = workOnScreen();
  if (replacing && !confirm('Fill the tool with the sample student?\n\n' +
      'The assessment on screen goes — the scores, the child, the date and both comments — ' +
      'and Maya’s made-up ones take its place.\n\n' +
      'If that was a mistake, "Undo the clear" appears next to the buttons and puts it all back.')) return;
  if (replacing) stashForUndo();
  Object.keys(scores).forEach(k => delete scores[k]);
  Object.entries(SAMPLE_SCORES).forEach(([lesson, score]) => { scores[lesson] = score; });
  el('initials').value = SAMPLE_INITIALS;
  el('adate').value = todayISO();
  el('strengthsComment').value = SAMPLE_STRENGTHS;
  el('stretchesComment').value = SAMPLE_STRETCHES;
  el('unitSelect').value = 'all';
  isSample = true;
  sampleNudged = false;
  paintSampleStrip();
  updateLessons();
  updateCharts();
  saveState();
  if (replacing) say('The sample student is on screen now. Press "Undo the clear" to put your ' +
                     'assessment back.', 30000);
}

// One click and no question while the sample is exactly as it arrived — there
// is nothing of anyone's to lose. The moment a teacher has typed real initials,
// a real comment or a real score on top of her, there is.
function clearSample() {
  const losing = workOnScreen();
  if (losing && !confirm('Clear this?\n\nThe scores, the child, the date and both comments all go, ' +
      'including anything you have typed on top of the sample.\n\n' +
      'If that was a mistake, "Undo the clear" appears next to the buttons and puts it all back.')) return;
  if (losing) stashForUndo();
  Object.keys(scores).forEach(k => delete scores[k]);
  el('initials').value = '';
  el('adate').value = todayISO();
  el('strengthsComment').value = '';
  el('stretchesComment').value = '';
  el('unitSelect').value = '';
  currentUnit = '';
  isSample = false;
  sampleNudged = false;
  paintSampleStrip();
  updateLessons();
  updateCharts();
  saveState();
  say(losing ? 'Cleared. Press "Undo the clear" if that was not what you meant.'
             : 'Sample cleared. The tool is empty and ready for a real assessment.',
      losing ? 30000 : 6000);
}

// ---------------------------------------------------------------------------
// Exports
// ---------------------------------------------------------------------------
function whoLine() {
  const initials = (el('initials').value || '').trim().toUpperCase();
  const date = el('adate').value || todayISO();
  return { initials: initials, date: date };
}

// Every download used to be called math_assessment_report.pdf, so a teacher
// assessing 25 children ended up with 25 files overwriting each other in the
// Downloads folder with nothing to tell them apart.
function fileBase() {
  const who = whoLine();
  const tag = (who.initials.replace(/[^A-Za-z0-9]/g, '') || 'no-initials');
  return 'math-assessment-' + (isSample ? 'SAMPLE-' : '') + tag + '-' + who.date;
}

function download(blob, filename) {
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => window.URL.revokeObjectURL(url), 1000);
}

function exportPDF() {
  // A blocked CDN — a school firewall, an outage, a plane — used to show the
  // teacher the raw JavaScript error, and "please try again" was never going
  // to work because the script was never going to arrive.
  if (!window.jspdf || !window.jspdf.jsPDF) {
    say('PDF export needs the internet, and this computer cannot reach it right now. ' +
        'Export CSV and Export JSON still work, and your browser’s Print will still print this page.');
    return;
  }

  try {
    const { jsPDF } = window.jspdf;
    const who = whoLine();
    const strengths = el('strengthsComment').value;
    const stretches = el('stretchesComment').value;
    const counts = countScores();

    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    let yPosition = 20;

    const colors = {
      title: [44, 62, 80],
      emerging: [55, 138, 221],
      developing: [186, 117, 23],
      mastered: [99, 153, 34],
      text: [44, 62, 80],
      lightText: [127, 140, 141]
    };

    // Everything below goes through these two. A long Strengths comment used
    // to run straight off the bottom of page one — 64 lines drawn down to
    // y=331mm on a 297mm page — taking the Stretches section with it, silently.
    const room = mm => { if (yPosition > pageHeight - mm) { pdf.addPage(); yPosition = 20; } };
    const drawLines = (lines, x, lineHeight) => {
      lines.forEach(line => { room(15); pdf.text(line, x, yPosition); yPosition += lineHeight; });
    };

    pdf.setFontSize(20);
    pdf.setTextColor(...colors.title);
    pdf.text('Math Assessment Report', pageWidth / 2, yPosition, { align: 'center' });
    yPosition += 8;

    pdf.setFontSize(10);
    pdf.setTextColor(...colors.lightText);
    // The sample student is named on the printed page too, so a sheet left on
    // a desk can never be read as a real child's record.
    pdf.text(isSample ? SAMPLE_LABEL : 'Child: ' + (who.initials || '—') + '   ·   Date: ' + who.date,
             pageWidth / 2, yPosition, { align: 'center' });
    yPosition += 10;

    pdf.setFontSize(12);
    pdf.setTextColor(...colors.title);
    pdf.text('Assessment Summary', 15, yPosition);
    yPosition += 8;

    pdf.setFontSize(11);
    pdf.setTextColor(...colors.emerging);
    pdf.text(`Emerging / Beginning: ${counts.e}`, 15, yPosition);
    yPosition += 5;

    pdf.setTextColor(...colors.developing);
    pdf.text(`Developing: ${counts.d}`, 15, yPosition);
    yPosition += 5;

    pdf.setTextColor(...colors.mastered);
    pdf.text(`Mastered: ${counts.m}`, 15, yPosition);
    yPosition += 10;

    room(30);
    pdf.setFontSize(13);
    pdf.setTextColor(...colors.mastered);
    pdf.text('Strengths', 15, yPosition);
    yPosition += 6;

    pdf.setFontSize(10);
    pdf.setTextColor(...colors.text);
    drawLines(pdf.splitTextToSize(strengths || '(No strengths recorded)', pageWidth - 30), 15, 4);
    yPosition += 5;

    const masteredUnits = [];
    Object.entries(curriculum).forEach(([unitName, lessons]) => {
      const hasMastered = lessons.some(lesson => scores[lesson] === 'Mastered');
      if (hasMastered) masteredUnits.push(unitName);
    });

    if (masteredUnits.length > 0) {
      room(20);
      pdf.setFontSize(9);
      pdf.setTextColor(...colors.mastered);
      pdf.text('Mastered in:', 15, yPosition);
      yPosition += 4;
      pdf.setFontSize(9);
      pdf.setTextColor(...colors.lightText);
      masteredUnits.forEach(unit => { room(15); pdf.text(`• ${unit}`, 18, yPosition); yPosition += 4; });
      yPosition += 3;
    }

    room(30);
    pdf.setFontSize(13);
    pdf.setTextColor(...colors.emerging);
    pdf.text('Stretches: Areas of Growth', 15, yPosition);
    yPosition += 6;

    pdf.setFontSize(10);
    pdf.setTextColor(...colors.text);
    drawLines(pdf.splitTextToSize(stretches || '(No stretches recorded)', pageWidth - 30), 15, 4);
    yPosition += 5;

    const lessonsByUnit = {};
    Object.entries(curriculum).forEach(([unitName, lessons]) => {
      const needsWork = [];
      lessons.forEach(lesson => {
        if (scores[lesson] === 'Emerging' || scores[lesson] === 'Developing') {
          needsWork.push({ lesson, score: scores[lesson] });
        }
      });
      if (needsWork.length > 0) {
        lessonsByUnit[unitName] = needsWork;
      }
    });

    if (Object.keys(lessonsByUnit).length > 0) {
      room(30);

      pdf.setFontSize(12);
      pdf.setTextColor(...colors.title);
      pdf.text('Needs Work In:', 15, yPosition);
      yPosition += 6;

      Object.entries(lessonsByUnit).forEach(([unitName, lessons]) => {
        room(20);

        pdf.setFontSize(10);
        pdf.setTextColor(...colors.title);
        pdf.text(unitName, 18, yPosition);
        yPosition += 4;

        lessons.forEach(item => {
          room(15);
          pdf.setFontSize(8);
          const scoreColor = item.score === 'Emerging' ? colors.emerging : colors.developing;
          pdf.setTextColor(...scoreColor);
          pdf.text(`${item.lesson} — ${item.score}`, 21, yPosition);
          yPosition += 3.5;
        });
        yPosition += 2;
      });
    }

    pdf.save(fileBase() + '.pdf');
    say('PDF saved to your Downloads folder.', 5000);
  } catch (err) {
    say('The PDF did not save. Nothing on screen has been lost — Export CSV and Export JSON ' +
        'still work, and your browser’s Print will still print this page.');
    console.error('PDF Export Error:', err);
  }
}

function exportJSON() {
  const who = whoLine();
  const kept = {};
  Object.entries(scores).forEach(([lesson, score]) => {
    if (score && lessonExists(lesson)) kept[lesson] = score;
  });

  const assessment = {
    tool: 'Math Assessment Tracker',
    sampleStudent: isSample ? SAMPLE_LABEL : null,
    child: who.initials,
    date: who.date,
    unitOnScreen: currentUnit === 'all' ? 'All Lessons' : (currentUnit || 'None chosen'),
    counts: countScores(),
    scores: kept,
    strengths: el('strengthsComment').value,
    stretches: el('stretchesComment').value,
    exported: new Date().toISOString()
  };

  download(new Blob([JSON.stringify(assessment, null, 2)], { type: 'application/json' }),
           fileBase() + '.json');
  say('JSON saved to your Downloads folder.', 5000);
}

// One quoted cell, quotes doubled. Anything a teacher types — a comma, a
// quotation mark, a line break in the middle of a comment — now survives the
// trip into a spreadsheet instead of splitting the row in half.
function csvCell(value) {
  return '"' + String(value === null || value === undefined ? '' : value).replace(/"/g, '""') + '"';
}

function exportCSV() {
  const who = whoLine();
  const counts = countScores();
  const strengths = el('strengthsComment').value;
  const stretches = el('stretchesComment').value;

  let csv = '';
  csv += csvCell('Child (initials)') + ',' + csvCell(who.initials) + '\n';
  csv += csvCell('Date') + ',' + csvCell(who.date) + '\n';
  if (isSample) csv += csvCell('Sample student') + ',' + csvCell(SAMPLE_LABEL) + '\n';
  csv += csvCell('Emerging / Beginning') + ',' + csvCell(counts.e) + '\n';
  csv += csvCell('Developing') + ',' + csvCell(counts.d) + '\n';
  csv += csvCell('Mastered') + ',' + csvCell(counts.m) + '\n';
  // Both comment boxes used to be read into variables here and then never
  // written to the file, so the CSV quietly threw away everything the teacher
  // had actually written about the child.
  csv += csvCell('Strengths') + ',' + csvCell(strengths) + '\n';
  csv += csvCell('Stretches: Areas of Growth') + ',' + csvCell(stretches) + '\n';
  csv += '\n';

  csv += csvCell('Unit') + ',' + csvCell('Lesson') + ',' + csvCell('Score') + '\n';
  Object.entries(curriculum).forEach(([unitName, lessons]) => {
    lessons.forEach(lesson => {
      if (scores[lesson]) {
        csv += csvCell(unitName) + ',' + csvCell(lesson) + ',' + csvCell(scores[lesson]) + '\n';
      }
    });
  });

  download(new Blob([csv], { type: 'text/csv' }), fileBase() + '.csv');
  say('CSV saved to your Downloads folder.', 5000);
}

// ---------------------------------------------------------------------------
// Clearing
// ---------------------------------------------------------------------------
function clearForm() {
  // One click used to wipe every score and both comments with no question
  // asked and nothing kept, and since none of it was saved anywhere it was
  // gone for good.
  if (!confirm('Clear this assessment?\n\nThe scores, the child, the date and both comments all go.\n\n' +
               'If that was a mistake, "Undo the clear" appears next to the buttons and puts it all back.')) return;

  lastCleared = currentState();

  el('unitSelect').value = '';
  el('initials').value = '';
  el('adate').value = todayISO();
  el('strengthsComment').value = '';
  el('stretchesComment').value = '';
  Object.keys(scores).forEach(k => delete scores[k]);
  currentUnit = '';
  isSample = false;
  sampleNudged = false;
  paintSampleStrip();
  updateLessons();
  updateCharts();
  saveState();
  el('undoClearBtn').hidden = false;
  say('Cleared. Press "Undo the clear" if that was not what you meant.', 30000);
}

function undoClear() {
  if (!lastCleared) return;
  applyState(lastCleared);
  currentUnit = el('unitSelect').value;
  lastCleared = null;
  el('undoClearBtn').hidden = true;
  saveState();
  say('Put back.', 5000);
}

// ---------------------------------------------------------------------------
// Start up
// ---------------------------------------------------------------------------
initUnits();
el('adate').value = todayISO();

const saved = readState();
if (saved && saved.visited) {
  // Somebody has been here before: their work comes back exactly as they left
  // it, sample or not.
  applyState(saved);
} else {
  // First arrival, nothing of anyone's to lose. Show the sample student so the
  // page is never a stranger's first impression of two empty boxes. Clearing
  // her writes a state with visited:true, so she never comes back uninvited.
  loadSample();
}
paintSampleStrip();
updateLessons();
updateCharts();

// If jsPDF never arrived, say so once on arrival rather than letting a teacher
// find out only when a PDF they needed does not appear.
window.addEventListener('load', () => {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    say('Export PDF is not available — this computer cannot reach the internet, and that button ' +
        'needs it. Everything else works: scoring, saving, Export CSV, Export JSON and Print.');
  }
});
</script>

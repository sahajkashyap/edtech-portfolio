<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social-Emotional Assessment</title>
    <meta name="description" content="A one-page social-emotional assessment sheet for a primary classroom. Score six skills, write strengths and next steps, print or export. Everything stays on the laptop it is opened on.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231F5FA8'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
    <!-- jsPDF comes from a CDN, so it is the one part of this tool that needs the
         internet. On a school network that blocks it, or a plane, the script never
         arrives and window.jspdf is undefined. exportPDF() says so in plain words
         and points at Print and CSV, which need nothing at all.

         WHAT WAS WRONG: this was a plain <script> in the head, which stops the
         browser drawing ANYTHING until the request answers. On a school filter
         that drops the request rather than refusing it, the teacher sat in front
         of a completely blank white page for eight or nine seconds — no title,
         no text, no buttons. `defer` lets the page draw first and lets the
         optional extra arrive whenever it arrives, or never. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
            onerror="window.__pdfLibBlocked = true;"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #E8D4C4;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* A browser with JavaScript switched off used to show an empty skills
           panel, a blank chart, four zeroes and five buttons that did nothing,
           with nothing anywhere saying why. */
        .noscript {
            max-width: 720px;
            margin: 0 auto 20px;
            background: #8A5200;
            color: white;
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 6px;
        }

        /* WHAT WAS WRONG: most of the small type on this page was below the
           WCAG AA minimum of 4.5:1 against the page background — the privacy
           promise itself was the worst of them at 2.4:1. Every colour below is
           measured, and tests/run-tests.js sweeps every visible text node on
           the page rather than checking a list of named controls, so a new
           colour cannot slip in under the bar. */
        .header .what {
            font-size: 14px;
            color: #4F4740;
            margin-bottom: 16px;
        }

        .who {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .who label {
            font-size: 13px;
            color: #4F4740;
            font-weight: 600;
        }

        .who input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #767676;
            border-radius: 4px;
        }

        #initials {
            width: 90px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .privacy {
            font-size: 12.5px;
            color: #2F6100;
            font-weight: bold;
        }

        /* One place to talk to the teacher, so every path that gives up says why.
           WHAT WAS WRONG: the message box grew and shrank in the layout, and
           every message removed itself on a timer nobody armed. Six seconds
           after a click the whole assessment jumped 51px up the screen with the
           teacher's hand still on the mouse — and the skill rows are 65px
           apart, so the next click landed on the wrong child skill. The wrapper
           below reserves the space permanently and the message is laid over it,
           so nothing on this page can move on its own. */
        .say-wrap {
            position: relative;
            min-height: 58px;
            max-width: 900px;
            margin: 12px auto 0;
        }

        .say {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            font-size: 14px;
            color: #6B3400;
            background: #FFF3E0;
            border-left: 4px solid #8A5200;
            border-radius: 4px;
            padding: 10px 14px;
            text-align: left;
            display: none;
        }

        .say.on { display: block; }

        .say.warn {
            background: #FDEBE4;
            border-left-color: #A32E00;
            color: #7A2200;
            font-weight: 600;
        }

        /* WHAT WAS WRONG: the buttons are at the bottom of the page and their
           only feedback was this strip at the very top. On a 1280x800 laptop
           the message explaining why the PDF did not download was 94px ABOVE
           the viewport when it appeared, so "Export as PDF" on a blocked
           network looked exactly like a dead button. The same sentence is now
           mirrored directly above the button row, where the hand already is. */
        .say-wrap.bottom { margin: 22px auto 0; }

        .sample-banner {
            max-width: 900px;
            margin: 6px auto 0;
            background: #FFF8E1;
            border: 2px dashed #8A5200;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 14px;
            color: #5c3d00;
            display: none;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            text-align: left;
        }

        .sample-banner.on { display: flex; }

        /* The leftover-initials note is shown and hidden with the `hidden`
           attribute rather than a class, so that a check — and a screen reader —
           gets the same answer from the element as the eye does. */
        .leftover-banner:not([hidden]) { display: flex; }

        .sample-banner strong { font-size: 15px; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-box {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .chart-box h3 {
            font-size: 14px;
            color: #544C43;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        svg path { cursor: pointer; }

        svg path:focus {
            outline: 3px solid #333;
            outline-offset: 2px;
        }

        .chart-hint {
            font-size: 12.5px;
            color: #554E45;
            margin-top: 8px;
        }

        .count-boxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        /* grid-template-rows, not a plain block: the four numbers then sit on
           one baseline whatever happens to the labels above them. WHAT WAS
           WRONG: on paper "Not yet scored" wraps to three lines, so its number
           printed 16px below the other three and the row came out ragged. */
        .count-box {
            padding: 12px 6px;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 4px;
        }

        .count-box.emerging  { background-color: #1F5FA8; color: white; }
        .count-box.developing{ background-color: #8A5200; color: white; }
        .count-box.mastered  { background-color: #3F6414; color: white; }
        .count-box.none      { background-color: #5A544B; color: white; }

        .count-box:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .right-panel {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
        }

        .right-panel h3 {
            font-size: 14px;
            color: #544C43;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skill-item {
            background: white;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #ddd;
        }

        .skill-label {
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        .skill-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .score-btn {
            padding: 6px 10px;
            border: 1px solid #767676;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            background-color: white;
            color: #5A544B;
            font-family: inherit;
        }

        .score-btn:hover {
            background-color: #f5f5f5;
        }

        .score-btn.e { background-color: #1F5FA8; color: white; border-color: #1F5FA8; }
        .score-btn.d { background-color: #8A5200; color: white; border-color: #8A5200; }
        .score-btn.m { background-color: #3F6414; color: white; border-color: #3F6414; }

        /* Visible way out of a mis-click. The buttons have always toggled off if
           you press the same one twice, but nothing on screen said so, so the only
           obvious way back was Reset All — which wipes the whole assessment. */
        .undo-score {
            padding: 6px 8px;
            border: 1px solid #767676;
            border-radius: 3px;
            background: white;
            color: #5A544B;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            visibility: hidden;
        }

        .undo-score.on { visibility: visible; }

        .undo-score:hover {
            background: #f5f5f5;
            color: #333;
        }

        /* WHAT WAS WRONG: on an iPad — where a teacher taps these seven times
           per child while watching the child — E, D and M were 29x29 and the ×
           that erases a score was 26x29, sitting 6px from the M button. Aiming
           at Mastered and landing on × wipes the score instead of setting it.
           Anything driven by a finger rather than a mouse gets Apple's 44px,
           and that means every control on the page, not a corner of it. */
        @media (pointer: coarse) {
            .score-btn, .undo-score, .btn, #undoBtn,
            .sample-banner button, .close-btn {
                min-width: 44px;
                min-height: 44px;
            }
            /* Boxes you tap to type in, not buttons — height only. A 44px
               minimum WIDTH on a four-character initials box would do nothing
               but make it wider than it needs to be. */
            .who input { min-height: 44px; }
            .skill-buttons { gap: 10px; }
        }

        .comments-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 10px;
        }

        .comment-box {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
        }

        .comment-box h3 {
            font-size: 14px;
            color: #544C43;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .comment-box textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #767676;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            background-color: #E3F2FD;
            resize: vertical;
        }

        .comment-box textarea:focus {
            outline: none;
            border-color: #1F5FA8;
            box-shadow: 0 0 0 2px rgba(31, 95, 168, 0.2);
        }

        /* Anything in here is for paper only. See the print rules at the bottom
           of this stylesheet for why each piece has to exist. */
        .print-only { display: none; }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary { background-color: #1F5FA8; color: white; }
        .btn-primary:hover { background-color: #17497f; }

        .btn-secondary { background-color: #55504A; color: white; }
        .btn-secondary:hover { background-color: #413d38; }

        .btn-sample { background-color: #8A5200; color: white; }
        .btn-sample:hover { background-color: #6b3f00; }

        .btn-undo {
            background-color: #fff;
            color: #333;
            border: 2px solid #333;
        }

        .btn-undo[hidden] { display: none; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 0;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 20px;
            border-left: 4px solid #1F5FA8;
            background: #F3EFE7;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        .modal-header h2:focus { outline: 3px solid #1F5FA8; outline-offset: 3px; }

        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-skills {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-skill, .modal-empty {
            padding: 10px;
            background: #F3EFE7;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }

        .modal-footer {
            padding: 15px 20px;
            background: #F3EFE7;
            text-align: right;
            border-top: 1px solid #e0e0e0;
        }

        .close-btn {
            background: #55504A;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .close-btn:hover { background: #413d38; }

        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; }
            .comments-section { grid-template-columns: 1fr; }
        }

        /* WHAT WAS WRONG: at 320px — an iPhone SE, and any older phone — the
           page was 382px wide and scrolled sideways, so the right-hand edge of
           every card and the × on every skill row sat off the screen. The floor
           was the four-column tile grid plus 30px of padding on each side. */
        @media (max-width: 430px) {
            body { padding: 14px; }
            .count-boxes { grid-template-columns: repeat(2, 1fr); }
            .say-wrap { min-height: 96px; }
            .header h1 { font-size: 23px; }
        }

        /* Printing is the fallback when the PDF library cannot be reached, so the
           printed sheet has to be a real record: who, when, the counts, every
           skill and both comment boxes — and it has to be readable on the
           black-and-white printer in the school office. */
        @media print {
            @page { margin: 14mm; }

            body {
                background: #fff;
                padding: 0;
                font-size: 12pt;
            }

            .button-group, .privacy, .chart-hint, .undo-score, .say-wrap, .modal,
            .noscript, .sample-banner .btn, .count-box:hover {
                display: none !important;
            }

            .chart-box, .right-panel, .comment-box {
                background: #fff;
                border: 1px solid #999;
            }

            .print-only { display: block; }
            .print-inline { display: inline; }

            /* WHAT WAS WRONG: the printed record routinely runs to two sheets,
               and sheet two carried the tail of a child's social-emotional
               notes with no initials, no date and no heading — a page about a
               child with nothing on it saying which child. The CSV repeats the
               child and the date in every single row for exactly this reason.
               A fixed block is repeated by the browser on every printed page. */
            .print-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                font-size: 10pt;
                font-weight: 700;
                color: #000;
                border-bottom: 1px solid #444;
                padding-bottom: 3px;
            }

            .container { padding-top: 24px; }

            /* WHAT WAS WRONG: with the Child box left empty the printed sheet
               put the placeholder "J.M." on the paper in the same bold black as
               a real entry, naming a child who was never entered — and the date
               box printed "mm/dd/yyyy" and its calendar glyph. Both boxes are
               replaced on paper by plain text; an empty one becomes a ruled
               line to write on. */
            #initials, #adate { display: none !important; }
            .who-print {
                display: inline-block;
                font-size: 12pt;
                font-weight: 700;
                color: #000;
                min-width: 90px;
                border-bottom: 1px solid #444;
            }

            /* WHAT WAS WRONG: on paper the score the teacher GAVE printed as
               the palest letter in the row (white on a background Chrome does
               not print) while the two scores NOT given printed dark — the
               record read backwards, and on a mono printer it recorded nothing
               at all. Paper gets the word, not the coloured letter. */
            .skill-buttons { display: none !important; }
            .score-print {
                display: inline-block;
                font-size: 11pt;
                font-weight: 700;
                color: #000;
                border: 1.5px solid #000;
                border-radius: 3px;
                padding: 1px 8px;
                white-space: nowrap;
            }
            .score-print.unscored { font-weight: 400; border-style: dashed; }

            /* WHAT WAS WRONG: greyscale turns #378ADD, #639922 and #BA7517 into
               grey 123, 123 and 128 — the printed donut was one featureless
               ring saying nothing, and the four tiles printed white-on-white at
               2.3:1. The ring goes; the counts stay, in ink. */
            #pieChart { display: none !important; }
            .count-box {
                background: white !important;
                color: #000 !important;
                border: 2px solid #444;
            }

            /* WHAT WAS WRONG: a textarea does NOT grow to fit its text, whatever
               height: auto is told to do — it keeps its own scrollbox and prints
               only the slice of words that fits inside it. Ten lines of careful
               notes came out of the printer stopped mid-word, with no scrollbar
               on paper to show anything was missing. The boxes are not printed
               at all: what goes on the paper is the plain .print-copy beside
               each one, which is ordinary text and does grow. */
            .comment-box textarea { display: none !important; }

            .print-copy {
                display: block;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                min-height: 40px;
                font-size: 10.5pt;
                line-height: 1.35;
                color: #000;
            }

            /* Printing the tool as it arrives used to spill three lines onto an
               otherwise blank second sheet. Nothing is lost by it, but it is
               the first thing a stranger sees if they press Print in their
               first two minutes. Tighter paper type, and boxes that are not
               split across a page break. */
            .header h1 { font-size: 17pt; }
            .header .what { font-size: 9.5pt; }
            .main-content { margin-top: 8px; margin-bottom: 12px; gap: 14px; }
            .chart-box, .right-panel, .comment-box { padding: 10px; }
            .skills-list { gap: 6px; }
            .skill-item { padding: 6px 8px; }
            .skill-label { font-size: 10.5pt; }
            .comment-box textarea { min-height: 0; }
            .comment-box, .skill-item, .chart-box { break-inside: avoid; }
            .sample-banner { break-inside: avoid; }

            .main-content, .comments-section {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <noscript>
        <div class="noscript">
            This page needs JavaScript switched on to work. With it off, the
            skills list below stays empty and the score and export buttons do
            nothing. Turn JavaScript on for this page and reload, or print this
            sheet and fill it in by hand.
        </div>
    </noscript>

    <!-- Paper only, and repeated on every printed page. See the print rules. -->
    <div class="print-only print-header" id="printHeader"></div>

    <div class="container">
        <div class="header">
            <h1>Social-Emotional Assessment</h1>
            <p class="what">Six social-emotional skills, scored Emerging, Developing or Mastered, for one child at a time.</p>
            <!-- Initials and a date, never a full name. A child's name typed into a
                 browser is a child's name sitting on a shared laptop; initials say
                 who it is to the teacher and nothing to anyone else. -->
            <div class="who">
                <label for="initials">Child</label>
                <input type="text" id="initials" maxlength="4" placeholder="J.M." autocomplete="off">
                <span class="print-only print-inline who-print" id="initialsPrint"></span>
                <label for="adate">Date</label>
                <input type="date" id="adate">
                <span class="print-only print-inline who-print" id="datePrint"></span>
                <span class="privacy">● Stays on this laptop</span>
            </div>
            <div class="say-wrap">
                <div class="say" id="saymsg" role="status" aria-live="polite"></div>
            </div>
            <div class="sample-banner" id="sampleBanner">
                <span id="sampleBannerText"></span>
                <button class="btn btn-secondary" id="clearSampleBtn" onclick="clearSample()">Clear the sample</button>
            </div>
            <!-- The example label can come off with the sample's initials still
                 in the Child box — nothing on the sheet can tell M.T. the made-up
                 child from M.T. the real one, so the tool says where those
                 letters came from instead of guessing. -->
            <div class="sample-banner leftover-banner" id="sampleInitialsNote" hidden>
                <span id="sampleInitialsNoteText"></span>
                <button class="btn btn-secondary" id="dropSampleInitialsBtn" onclick="dropSampleInitials()">Empty the Child box</button>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="chart-box">
                    <h3>Assessment Overview</h3>
                    <svg id="pieChart" viewBox="0 0 200 200" style="width: 180px; height: 180px;"></svg>
                    <p class="chart-hint">Click a colour, or a box below, to see which skills are in it.</p>
                    <div class="count-boxes">
                        <button class="count-box emerging" id="countEmerging" onclick="openModal('e')">
                            <div id="countEText">Emerging</div>
                            <div id="numEmerging">0</div>
                        </button>
                        <button class="count-box developing" id="countDeveloping" onclick="openModal('d')">
                            <div id="countDText">Developing</div>
                            <div id="numDeveloping">0</div>
                        </button>
                        <button class="count-box mastered" id="countMastered" onclick="openModal('m')">
                            <div id="countMText">Mastered</div>
                            <div id="numMastered">0</div>
                        </button>
                        <button class="count-box none" id="countNone" onclick="openModal('x')">
                            <div id="countNText">Not yet scored</div>
                            <div id="numNone">0</div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <h3>Skills Assessment</h3>
                <div class="skills-list" id="skillsList"></div>
            </div>
        </div>

        <div class="comments-section">
            <div class="comment-box">
                <h3>Strengths</h3>
                <textarea id="strengths" placeholder="Describe student strengths and positive growth in social-emotional skills..."></textarea>
                <div class="print-only print-copy" id="strengthsPrint" aria-hidden="true"></div>
            </div>
            <div class="comment-box">
                <h3>Stretches: Areas of Growth</h3>
                <textarea id="stretches" placeholder="Identify areas where the student is working toward growth..."></textarea>
                <div class="print-only print-copy" id="stretchesPrint" aria-hidden="true"></div>
            </div>
        </div>

        <!-- The same sentence as the strip at the top of the page, put where the
             hand already is. See the note on .say-wrap.bottom in the stylesheet. -->
        <div class="say-wrap bottom">
            <div class="say" id="saymsgBottom" aria-hidden="true"></div>
        </div>

        <div class="button-group">
            <button class="btn btn-sample" id="sampleBtn" onclick="loadSample()">Try it with a sample student</button>
            <button class="btn btn-primary" onclick="exportPDF()">Export as PDF</button>
            <button class="btn btn-primary" onclick="exportCSV()">Export as CSV</button>
            <button class="btn btn-primary" onclick="printSheet()">Print</button>
            <button class="btn btn-secondary" onclick="resetAll()">Reset All</button>
            <button class="btn btn-undo" id="undoBtn" hidden onclick="undoReset()">Undo the clear</button>
        </div>
    </div>

    <!-- Modal. role="dialog" + aria-modal, the keyboard is moved into it on open
         and held inside it while it is there, and put back where it came from on
         close. WHAT WAS WRONG: opening a band list left focus on the button
         behind the overlay, so Tab walked the page underneath the dark screen
         and Enter there changed a score nobody could see; Close was 32 Tab
         presses away. -->
    <div id="modal" class="modal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle" tabindex="-1">Skills</h2>
            </div>
            <div class="modal-body">
                <div class="modal-skills" id="modalSkills"></div>
            </div>
            <div class="modal-footer">
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const skills = [
            { id: 0, label: "Shows curiosity and asks questions" },
            { id: 1, label: "Follows classroom routines and directions" },
            { id: 2, label: "Uses strategies to self-regulate" },
            { id: 3, label: "Shows empathy and respect for diverse perspectives" },
            { id: 4, label: "Persists with challenging tasks" },
            { id: 5, label: "Engages with conflict resolution with more independence" }
        ];

        let scores = {};
        let comments = { strengths: '', stretches: '' };
        let isSample = false;          // true while any of the made-up child is on screen
        // Which skill rows still hold the score Maya arrived with. This is how the
        // tool tells "the teacher happened to also mark row 3 Emerging" from
        // "row 3 is still Maya's". See leaveSampleIfGone().
        let sampleScoreKeys = [];
        // The Child box is the one part of Maya nothing can tell apart from a
        // real child's, because some real children's initials ARE M.T. So the
        // tool remembers whether the letters in that box were put there by the
        // sample or typed by the teacher, and never guesses. See sampleInitialsNote.
        let sampleInitialsLeft = false;
        let sampleCleared = false;     // she has been sent away on this laptop
        let undoState = null;          // one step back, held in storage as well
        let hadSavedRecord = false;    // something was read back off this laptop
        let otherTabSaved = false;     // a second tab of this tool is the live one
        let modalBand = null;          // which band the open panel is describing
        let modalOpener = null;        // where to put the keyboard back
        let lastWritten = null;        // what this tab last wrote, to spot echoes
        let notSaving = false;         // the browser is refusing to store anything
        let lastGoodDate = null;       // the last date the tool could actually use

        const colors = {
            e: '#1F5FA8',
            d: '#8A5200',
            m: '#3F6414',
            x: '#5A544B'
        };
        const bandNames = { e: 'Emerging', d: 'Developing', m: 'Mastered', x: 'Not yet scored' };

        // The sample child. She is the same Maya Torres in every tool in this
        // portfolio, and her profile is deliberately mixed — two skills she is
        // strong in, two on the way, two she is still finding hard. A child who
        // scores the same on everything shows a visitor nothing.
        const SAMPLE = {
            initials: 'M.T.',
            name: 'Maya Torres',
            scores: { 0: 'm', 1: 'd', 2: 'e', 3: 'm', 4: 'e', 5: 'd' },
            strengths: "Maya asks a lot of questions and will follow an idea past the end " +
                       "of the lesson. She notices when someone is left out — twice this " +
                       "month she has brought a new child into her group without being asked.",
            stretches: "When the work gets hard she stops and waits rather than trying a " +
                       "second way in, and a change in the routine can tip her into " +
                       "frustration. We are working on two things: naming the feeling " +
                       "before it grows, and picking one of her own strategies (a drink of " +
                       "water, two minutes at the calm table) before she comes to find me."
        };

        const SAMPLE_LABEL = 'Sample student — Maya Torres (M.T.)';

        // WHAT WAS WRONG: the sheet used to be six separate keys written inside
        // one try/catch. A browser that starts refusing writes part way through —
        // a disk filling up while a teacher works — accepted the scores and then
        // refused the initials, so this child's scores were saved next to the
        // previous child's initials and comments, and that mixture came back on
        // the next reload and exported under the wrong child's name. One key is
        // one write: it lands whole or not at all.
        const K_RECORD = 'seRecord';
        // The one step of Undo is saved too. It used to live only in a variable
        // while storage had already been emptied, so a refresh — the very thing
        // somebody does when a page looks wrong — turned "Undo brings it straight
        // back" into a promise with nothing behind it.
        const K_UNDO = 'seUndo';
        // Anything unreadable is moved here rather than written over, so a
        // teacher (or somebody helping them) still has it to look at.
        const K_KEPT = 'seUnreadable';
        // What the version before this one wrote. Read once, so nobody's saved
        // assessment is lost in the move, then cleared away.
        const LEGACY = ['seScores', 'seComments', 'seInitials', 'seDate', 'seSample', 'seSeen'];

        // ---------------------------------------------------------------------
        // One place to talk to the teacher. Never "Error:" — say what happened
        // and what to do next.
        // ---------------------------------------------------------------------
        // WHAT WAS WRONG, twice over:
        //  1. every call left its own timer running, so an earlier message's
        //     timer wiped a later one off the screen before its time was up.
        //     A token fixes it: only the newest message may clear the line.
        //  2. every message had the same weight, so the standing warning
        //     "THIS ASSESSMENT IS NOT BEING SAVED" was replaced by the cheerful
        //     word "Saved" the moment the teacher did what it told them to do —
        //     export — and six seconds later the screen said nothing at all.
        //     A warning now holds the line until it expires.
        let sayToken = 0;
        let warningUntil = 0;
        function say(msg, ms, isWarning) {
            if (!isWarning && Date.now() < warningUntil) return;   // do not talk over a warning
            const mine = ++sayToken;
            if (isWarning) warningUntil = Date.now() + (ms || 8000);
            paintSay(msg, isWarning);
            clearTimeout(say._t);
            say._t = setTimeout(() => {
                if (sayToken !== mine) return;
                if (isWarning) warningUntil = 0;
                paintSay('', false);
            }, ms || 8000);
        }

        // The same words in both places: the strip under the header, and the one
        // directly above the button row, because the buttons are at the bottom
        // of the page and on a 1280x800 laptop the header strip is off-screen.
        function paintSay(msg, isWarning) {
            [document.getElementById('saymsg'), document.getElementById('saymsgBottom')]
                .forEach(el => {
                    el.textContent = msg;
                    el.classList.toggle('on', !!msg);
                    el.classList.toggle('warn', !!msg && !!isWarning);
                });
        }

        function sayText() { return document.getElementById('saymsg').textContent; }

        // The one warning about saving, said the same way everywhere it is needed.
        function sayNotSaved() {
            notSaving = true;
            say('THIS ASSESSMENT IS NOT BEING SAVED — this browser refused to store it ' +
                '(a private window, or the disk is full). Print it or export it before ' +
                'you close this tab.', 120000, true);
        }

        // WHAT WAS WRONG: once that warning appeared it never came down, even
        // after the teacher freed up disk space and saving started working
        // again — so the tool went on insisting nothing was being kept while it
        // was being kept perfectly well.
        function saySavingWorksAgain() {
            if (!notSaving) return;
            notSaving = false;
            warningUntil = 0;
            say('Saving is working again — this assessment is on this laptop.', 6000);
        }

        // Today, as this laptop sees it. input.valueAsDate = new Date() reads the
        // UTC day, so a teacher filling this in on a Tuesday evening in California
        // got Wednesday's date on the sheet and in the filename.
        function todayLocal() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }

        // WHAT WAS WRONG: four places read the date box directly and each made up
        // its own mind about a date the tool could not use. With the box mid-edit
        // and empty, the PDF printed "Date: —" while its own filename carried
        // today and the CSV said today in both places — one assessment, three
        // different answers to "when". Everything reads the date through here
        // now, so the screen, both exports, both filenames and what comes back
        // after a refresh always agree.
        function dateValue() {
            const raw = document.getElementById('adate').value;
            return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : '';
        }

        // What a date the tool cannot use looks like on screen, on paper and in
        // the exports: nothing, said out loud, rather than today quietly.
        const NO_DATE = 'no date';

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Initialize
        function init() {
            loadFromStorage();
            // First arrival, nothing saved anywhere: show the sample child rather
            // than an empty tool, so a visitor sees the chart and the report
            // populated. Asked before the date box is filled in, because a date
            // the tool put there itself is not a reason to call this a used tool.
            const first = firstVisit();
            if (first) {
                applySample();
                saveToStorage();
                say('This is Maya Torres, a made-up sample, so there is something to look at ' +
                    'straight away. The button in the dashed box above clears her.', 12000);
            }
            // WHAT WAS WRONG: this filled in today whenever the box was empty,
            // including on a saved record whose date the teacher had deliberately
            // emptied — so an assessment recorded for 4 May came back dated
            // today with no message. Today is only filled in when nothing has
            // ever been saved on this laptop.
            if (!hadSavedRecord && !dateValue()) {
                document.getElementById('adate').value = todayLocal();
            }
            lastGoodDate = dateValue();
            renderSkills();
            updateChart();
            renderComments();
            renderSample();
            renderUndo();
            renderPrintBits();
        }

        function firstVisit() {
            if (sampleCleared || hadSavedRecord) return false;
            try {
                return [K_RECORD, K_UNDO].concat(LEGACY)
                    .every(k => localStorage.getItem(k) === null);
            } catch (err) {
                return false;   // a browser that will not remember gets the empty sheet
            }
        }

        // ---------------------------------------------------------------------
        // The skills list
        // ---------------------------------------------------------------------
        function renderSkills() {
            const skillsList = document.getElementById('skillsList');

            // This list is thrown away and rebuilt after every score, which means
            // the button the teacher is standing on is destroyed underneath them.
            // Scoring with a mouse hid that; scoring from the keyboard did not.
            // Enter on a level registered the score and then dropped focus all the
            // way back to <body>, so a keyboard-only teacher had to Tab in from the
            // top of the page again for every single skill, and could never press
            // the same level twice to take it off. Remember which button had focus
            // and hand it to the replacement.
            const active = document.activeElement;
            const focusKey = (active && active.dataset && skillsList.contains(active))
                ? active.dataset.k : null;

            skillsList.innerHTML = '';

            skills.forEach(skill => {
                const skillItem = document.createElement('div');
                skillItem.className = 'skill-item';

                const score = scores[skill.id] || null;
                skillItem.style.borderLeftColor = score ? colors[score] : '#ddd';

                // aria-label and aria-pressed: the accessible name of a button is
                // its text, so a screen reader announced these as "E", "D", "M"
                // with nothing saying what they meant and nothing saying which
                // one was the child's score — that was carried by background
                // colour alone.
                const btn = (k, cls, word) => `
                    <button class="score-btn ${score === k ? cls : ''}" data-k="${skill.id}-${k}"
                            onclick="setScore(${skill.id}, '${k}')"
                            aria-label="${word}: ${esc(skill.label)}"
                            aria-pressed="${score === k}" title="${word}">${cls.toUpperCase()}</button>`;

                skillItem.innerHTML = `
                    <span class="skill-label">${esc(skill.label)}</span>
                    <div class="skill-buttons">
                        ${btn('e', 'e', 'Emerging')}
                        ${btn('d', 'd', 'Developing')}
                        ${btn('m', 'm', 'Mastered')}
                        <button class="undo-score ${score ? 'on' : ''}" data-k="${skill.id}-x" onclick="clearScore(${skill.id})"
                                title="Clear this score" aria-label="Clear this score">&times;</button>
                    </div>
                    <span class="print-only print-inline score-print ${score ? '' : 'unscored'}">${
                        score ? bandNames[score] : bandNames.x}</span>
                `;
                skillsList.appendChild(skillItem);
            });

            if (focusKey) {
                const again = skillsList.querySelector('[data-k="' + focusKey + '"]');
                // The × goes visibility:hidden once the score is cleared, and a
                // hidden button cannot take focus — that would put the teacher back
                // on <body>, which is the thing being fixed. Land them on the same
                // skill's Emerging button instead.
                if (again && getComputedStyle(again).visibility !== 'hidden') {
                    again.focus();
                } else if (again) {
                    const fallback = skillsList.querySelector(
                        '[data-k="' + focusKey.split('-')[0] + '-e"]');
                    if (fallback) fallback.focus();
                }
            }
        }

        // The teacher has made a judgement about this row, so it stops being one
        // of Maya's rows whatever letter they happened to choose. WHAT WAS WRONG:
        // the sample used to be identified by comparing letters, so a teacher who
        // deliberately clicked Developing on a row Maya also had as Developing
        // was treated as never having touched it.
        function touchScore(skillId) {
            sampleScoreKeys = sampleScoreKeys.filter(k => k !== String(skillId));
        }

        function afterScoreChange() {
            leaveSampleIfGone();
            saveToStorage();
            renderSkills();
            updateChart();
            renderModal();
            renderSample();
        }

        function setScore(skillId, score) {
            touchScore(skillId);
            scores[skillId] = scores[skillId] === score ? null : score;
            if (!scores[skillId]) delete scores[skillId];
            afterScoreChange();
        }

        // A mis-clicked score used to be undoable only by pressing the same button
        // again — which nothing on screen told you — or by Reset All, which throws
        // the whole assessment away.
        function clearScore(skillId) {
            touchScore(skillId);
            delete scores[skillId];
            afterScoreChange();
        }

        function counts() {
            // Counted off the skills list, not off the stored object, so a leftover
            // key from an older version of this tool cannot inflate a tile.
            const c = { e: 0, d: 0, m: 0, x: 0 };
            skills.forEach(s => {
                const v = scores[s.id];
                if (v === 'e' || v === 'd' || v === 'm') c[v]++;
                else c.x++;
            });
            return c;
        }

        function updateChart() {
            const c = counts();

            document.getElementById('numEmerging').textContent = c.e;
            document.getElementById('numDeveloping').textContent = c.d;
            document.getElementById('numMastered').textContent = c.m;
            document.getElementById('numNone').textContent = c.x;

            // The unscored skills are drawn too, in grey. The chart used to divide
            // by six and simply leave the rest of the ring blank, so one skill
            // scored looked like a chart that had failed to draw.
            const slice = n => (n / skills.length) * 360;
            drawPie([
                { angle: slice(c.e), color: colors.e, score: 'e', label: bandNames.e },
                { angle: slice(c.d), color: colors.d, score: 'd', label: bandNames.d },
                { angle: slice(c.m), color: colors.m, score: 'm', label: bandNames.m },
                { angle: slice(c.x), color: colors.x, score: 'x', label: bandNames.x }
            ]);
        }

        // The ring is drawn as real rings — a band starts at the inner edge, not
        // at the middle. WHAT WAS WRONG: the wedges ran all the way to the centre
        // and a white circle was laid on top to make it look like a donut, so the
        // plain white hole was still five invisible click targets. Clicking two
        // pixels apart in the same blank white space opened "Mastered" or
        // "Emerging" depending on which wedge happened to be underneath, while
        // the line below the chart says "Click a colour".
        const CHART = { cx: 100, cy: 100, R: 80, r: 50 };

        function ringPath(a1, a2) {
            const { cx, cy, R, r } = CHART;
            const at = (rr, a) => {
                const t = a * Math.PI / 180;
                return [cx + rr * Math.cos(t), cy + rr * Math.sin(t)];
            };
            const sweep = a2 - a1;
            if (sweep >= 359.99) {
                // A single band holding every skill asks for a 360° arc, whose
                // start point IS its end point — SVG then throws the arc away and
                // draws a bare line, so the chart went blank at exactly the moment
                // it had the clearest thing to say ("all six Mastered"), and the
                // click target went with it. Two half-circle arcs describe the
                // same ring with no such ambiguity; the second pair, with
                // fill-rule evenodd, punches the hole out of it.
                return `M ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx} ${cy + R} ` +
                       `A ${R} ${R} 0 1 1 ${cx} ${cy - R} Z ` +
                       `M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx} ${cy + r} ` +
                       `A ${r} ${r} 0 1 0 ${cx} ${cy - r} Z`;
            }
            const large = sweep > 180 ? 1 : 0;
            const [x1o, y1o] = at(R, a1), [x2o, y2o] = at(R, a2);
            const [x2i, y2i] = at(r, a2), [x1i, y1i] = at(r, a1);
            return `M ${x1o} ${y1o} A ${R} ${R} 0 ${large} 1 ${x2o} ${y2o} ` +
                   `L ${x2i} ${y2i} A ${r} ${r} 0 ${large} 0 ${x1i} ${y1i} Z`;
        }

        function drawPie(slices) {
            const svg = document.getElementById('pieChart');
            svg.innerHTML = '';
            let currentAngle = -90;

            slices.forEach(slice => {
                if (slice.angle <= 0) return;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', ringPath(currentAngle, currentAngle + slice.angle));
                path.setAttribute('fill', slice.color);
                path.setAttribute('fill-rule', 'evenodd');
                path.setAttribute('stroke', 'white');
                path.setAttribute('stroke-width', '2');
                // The slices were mouse-only: no tabindex, no role, no key handler,
                // so the list of which skills sit in a band could not be opened
                // without a mouse.
                path.setAttribute('tabindex', '0');
                path.setAttribute('role', 'button');
                path.setAttribute('aria-label', slice.label);
                path.onclick = () => openModal(slice.score);
                path.onkeydown = e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(slice.score); }
                };
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = slice.label;
                path.appendChild(title);
                svg.appendChild(path);

                currentAngle += slice.angle;
            });
        }

        // ---------------------------------------------------------------------
        // The band list
        // ---------------------------------------------------------------------
        function openModal(score) {
            // Whatever the message strip was saying about the chart is about to
            // be contradicted by the panel opening over it. WHAT WAS WRONG: a
            // stranger who clicked all four tiles in their first minute left
            // "Nothing is marked Mastered yet." sitting behind an open list of
            // six skills for the rest of its six seconds.
            paintSay('', false);
            sayToken++;
            modalOpener = document.activeElement;
            modalBand = score;
            renderModal();
            document.getElementById('modal').style.display = 'block';
            document.getElementById('modalTitle').focus();
        }

        // Rebuilt from the live scores every time anything changes underneath it.
        // WHAT WAS WRONG: it was drawn once and then left, so scoring a skill or
        // clearing the whole assessment with the panel open left it listing a
        // record the tool was no longer in, with the tiles behind it disagreeing.
        function renderModal() {
            if (!modalBand) return;
            const score = modalBand;
            const filtered = (score === 'x')
                ? skills.filter(s => !scores[s.id])
                : skills.filter(s => scores[s.id] === score);

            document.getElementById('modalTitle').textContent =
                (score === 'x') ? 'Not yet scored' : `${bandNames[score]} Skills`;
            const modalSkills = document.getElementById('modalSkills');

            // An empty band used to be a message on the strip at the top of the
            // page instead of a panel, so pressing a tile that read 0 looked
            // like pressing a button that did nothing.
            if (filtered.length === 0) {
                modalSkills.innerHTML = '<div class="modal-empty">' + (score === 'x'
                    ? 'Every skill has a score. Nothing is left to do.'
                    : 'No skills are marked ' + esc(bandNames[score]) + ' yet.') + '</div>';
            } else {
                modalSkills.innerHTML = filtered
                    .map(s => `<div class="modal-skill">${esc(s.label)}</div>`)
                    .join('');
            }

            document.querySelector('.modal-header').style.borderLeftColor = colors[score];
        }

        function modalIsOpen() {
            return document.getElementById('modal').style.display === 'block';
        }

        function closeModal() {
            if (!modalIsOpen()) return;
            document.getElementById('modal').style.display = 'none';
            modalBand = null;
            // WHAT WAS WRONG: closing with the panel's own Close button left the
            // keyboard on an element that was now hidden, so the next Tab
            // restarted at the top of the page.
            const back = modalOpener;
            modalOpener = null;
            if (back && document.contains(back) && back.focus) {
                try { back.focus(); } catch (e) { /* it went away while open */ }
            }
        }

        // Hold the keyboard inside the panel while it is open.
        function trapTab(e) {
            if (e.key !== 'Tab' || !modalIsOpen()) return;
            const content = document.querySelector('.modal-content');
            const stops = Array.prototype.slice.call(content.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
            if (!stops.length) return;
            const first = stops[0], last = stops[stops.length - 1];
            // WHAT WAS WRONG: this asked "is focus inside the panel?", and the
            // panel's heading is inside it — but the heading is tabindex="-1",
            // so it is not a Tab stop. Shift-Tab from the heading, which is
            // exactly where the panel puts the keyboard when it opens, matched
            // neither branch and walked straight out of the back of the dialog
            // onto the page underneath the overlay. Ask which STOP focus is on
            // instead; the heading is simply not one of them.
            const at = stops.indexOf(document.activeElement);
            if (e.shiftKey && at <= 0) {
                e.preventDefault(); last.focus();
            } else if (!e.shiftKey && (at === -1 || at === stops.length - 1)) {
                e.preventDefault(); first.focus();
            }
        }

        // ---------------------------------------------------------------------
        // Comments and the paper copies
        // ---------------------------------------------------------------------
        function renderComments() {
            document.getElementById('strengths').value = comments.strengths;
            document.getElementById('stretches').value = comments.stretches;
            renderPrintBits();
        }

        // What actually goes on the paper. A textarea prints only what fits
        // inside it, so the printed sheet used to stop mid-word and lose the end
        // of the teacher's notes without saying so. These plain blocks hold the
        // same words and grow to whatever length they need. The same function
        // keeps the paper stand-ins for the Child and Date boxes, and the line
        // repeated at the top of every printed page, in step with the screen.
        function renderPrintBits() {
            document.getElementById('strengthsPrint').textContent =
                document.getElementById('strengths').value;
            document.getElementById('stretchesPrint').textContent =
                document.getElementById('stretches').value;

            const ini = (document.getElementById('initials').value || '').toUpperCase();
            const d = dateValue();
            // Blank really is blank. An empty stand-in is styled on paper as a
            // ruled line beside its label, so a sheet printed to be filled in by
            // hand has somewhere to write — instead of the box's own placeholder
            // "J.M.", which printed in the same bold black as a real entry and
            // named a child who was never entered.
            document.getElementById('initialsPrint').textContent = ini;
            document.getElementById('datePrint').textContent = d;

            // The header names the child, the date, and — if any of the made-up
            // example is still on the sheet — exactly which parts of it are hers.
            // It used to say only "Sample student — Maya Torres (M.T.), not a real
            // child" whatever the state was, so a sheet a teacher had half typed
            // over printed under Maya's name.
            const id = sheetIdentity();
            const sampleTail =
                id.kind === 'sample' ? ' — ' + SAMPLE_LABEL + ', not a real child'
              : id.kind === 'part'   ? ' — part sample. Still Maya Torres\'s, the made-up ' +
                                       'example: ' + sampleTraceParts().join(', ')
              : '';
            document.getElementById('printHeader').textContent =
                'Social-Emotional Assessment — Child: ' + (ini || '__________') +
                ' — Date: ' + (d || NO_DATE) + sampleTail;
        }

        // ---------------------------------------------------------------------
        // Storage. localStorage only — nothing on this page ever leaves the laptop.
        // ---------------------------------------------------------------------
        // readComments() used to be called at the top of saveToStorage(), so every
        // path that emptied the tool read the OLD text straight back off the screen
        // and put it back again. Reading the boxes is the job of the typing
        // handler alone; saving only ever writes down what the tool already knows.
        function readComments() {
            comments.strengths = document.getElementById('strengths').value;
            comments.stretches = document.getElementById('stretches').value;
        }

        // Returns true only if the record really reached the disk, so a caller
        // that is about to tell the teacher something has happened can tell the
        // truth about it.
        function saveToStorage() {
            renderPrintBits();

            // WHAT WAS WRONG: with the tool open in two tabs, one keystroke — or
            // one score click, or pressing Print — in the older tab wrote its
            // whole stale sheet over everything the newer tab had saved, with no
            // warning and no undo, because undoState lives in the page and the
            // stale tab's is empty. A tab that has been overtaken stops saving
            // and says so, rather than quietly winning the race.
            if (otherTabSaved) return false;

            let payload;
            try {
                payload = JSON.stringify({
                    v: 1,
                    scores: scores,
                    comments: comments,
                    initials: document.getElementById('initials').value,
                    date: dateValue(),
                    sample: isSample,
                    sampleCleared: sampleCleared,
                    sampleScoreKeys: sampleScoreKeys,
                    sampleInitials: sampleInitialsLeft
                });
            } catch (err) { payload = null; }

            if (payload === null) { sayNotSaved(); return false; }

            try {
                localStorage.setItem(K_RECORD, payload);
                lastWritten = payload;
                try { LEGACY.forEach(k => localStorage.removeItem(k)); } catch (e) { /* fine */ }
                saySavingWorksAgain();
                return true;
            } catch (err) {
                sayNotSaved();
                return false;
            }
        }

        // ---------------------------------------------------------------------
        // What comes back out of storage is not automatically trustworthy. It can
        // be a record half-written when the laptop was closed, something left by
        // an older version of this tool, or a line somebody edited by hand.
        // JSON.parse succeeding only means it is valid JSON — not that it is an
        // assessment. So everything read back is checked before it is used.
        // ---------------------------------------------------------------------
        // WHAT WAS WRONG: a stored value the tool did not recognise was counted
        // as "Not yet scored" on the tile, in the chart, in the CSV and in the
        // PDF, but was left out of the list you got by clicking that tile — the
        // number and the click were two different answers to one question. Only
        // e, d and m ever get in now, so there is nothing left to disagree about.
        function cleanScores(raw) {
            const out = {};
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
            skills.forEach(skill => {
                const v = raw[skill.id];
                if (v === 'e' || v === 'd' || v === 'm') out[skill.id] = v;
            });
            return out;
        }

        // WHAT WAS WRONG: String(parsed.strengths || '') turned an object into the
        // literal text "[object Object]", which then appeared in the comment box,
        // on the printed sheet, in the spreadsheet and in the PDF as if the
        // teacher had written it — and the next keystroke saved it back as real
        // text. Anything that is not a string is simply not a comment.
        function cleanComments(raw) {
            const out = { strengths: '', stretches: '' };
            if (!raw || typeof raw !== 'object') return out;
            if (typeof raw.strengths === 'string') out.strengths = raw.strengths;
            if (typeof raw.stretches === 'string') out.stretches = raw.stretches;
            return out;
        }

        function cleanInitials(raw) {
            // The box itself holds four characters. WHAT WAS WRONG: the saved
            // value was assigned straight to .value, which bypasses maxlength, so
            // a longer value written by an older version showed and exported a
            // full name where the tool promises initials only.
            return typeof raw === 'string' ? raw.slice(0, 4) : '';
        }

        function cleanDate(raw) {
            return (typeof raw === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw)) ? raw : '';
        }

        // A saved Undo is read back with the same suspicion as everything else:
        // anything that is not a whole, sensible snapshot is simply not offered.
        function cleanSnapshot(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const s = cleanScores(raw.scores);
            const c = cleanComments(raw.comments);
            const ini = cleanInitials(raw.initials);
            if (Object.keys(s).length === 0 && !c.strengths && !c.stretches && !ini) {
                return null;      // nothing in it worth putting back
            }
            return {
                scores: s, comments: c, initials: ini, date: cleanDate(raw.date),
                sample: raw.sample === true,
                sampleScoreKeys: Array.isArray(raw.sampleScoreKeys)
                    ? raw.sampleScoreKeys.map(String) : [],
                sampleInitials: raw.sampleInitials === true,
                label: (typeof raw.label === 'string' && raw.label)
                    ? raw.label.slice(0, 60) : 'Undo the clear'
            };
        }

        function loadFromStorage() {
            let rawRecord = null, rawUndo = null, legacy = null;
            try {
                // An older version of this tool stored a child's full name.
                // Anything still sitting in this browser under that key goes.
                localStorage.removeItem('seStudentName');
                rawRecord = localStorage.getItem(K_RECORD);
                rawUndo = localStorage.getItem(K_UNDO);
                if (rawRecord === null) {
                    legacy = {
                        scores: localStorage.getItem('seScores'),
                        comments: localStorage.getItem('seComments'),
                        initials: localStorage.getItem('seInitials'),
                        date: localStorage.getItem('seDate'),
                        sample: localStorage.getItem('seSample')
                    };
                }
            } catch (err) {
                say('This browser will not let the tool read or save anything, so ' +
                    'nothing here will survive a reload. Print or export before you ' +
                    'close the tab.', 120000, true);
                notSaving = true;
                return;
            }

            let rec = null;
            if (rawRecord !== null) {
                try {
                    rec = JSON.parse(rawRecord);
                } catch (err) {
                    // WHAT WAS WRONG: unreadable comments were emptied in total
                    // silence and then written over by the next click, so the one
                    // copy that might have been recovered by hand was gone. It is
                    // moved aside instead, and the teacher is told, in the same
                    // words the scores already used.
                    try { localStorage.setItem(K_KEPT, rawRecord); } catch (e) { /* nothing to keep */ }
                    say('Some of what was saved on this laptop could not be read, so the ' +
                        'tool has started empty. The unreadable copy has been kept aside ' +
                        'rather than written over.', 20000, true);
                    rec = null;
                }
            } else if (legacy && (legacy.scores || legacy.comments || legacy.initials)) {
                // The move from six keys to one. Read once, then dropped.
                let ls = null, lc = null;
                try { ls = JSON.parse(legacy.scores || 'null'); } catch (e) { ls = null; }
                try { lc = JSON.parse(legacy.comments || 'null'); } catch (e) { lc = null; }
                rec = {
                    scores: ls, comments: lc, initials: legacy.initials,
                    date: legacy.date, sample: legacy.sample === '1'
                };
                // WHAT WAS WRONG: the old version never wrote down WHICH rows were
                // Maya's, so this filled that in as "all six of them" and let the
                // letter comparison below sort it out. With six skills and three
                // bands, some real child's row matches one of Maya's about nine
                // times in ten — so a real child saved by the previous version came
                // back labelled, exported and filed as Maya Torres on a coincidence.
                // A record only counts as hers now on evidence that cannot happen by
                // accident. See isReallySample().
                rec.sample = rec.sample && isReallySample(rec);
                rec.sampleScoreKeys = rec.sample ? skills.map(s => String(s.id)) : [];
            }

            if (rec && typeof rec === 'object' && !Array.isArray(rec)) {
                hadSavedRecord = true;
                scores = cleanScores(rec.scores);
                comments = cleanComments(rec.comments);
                document.getElementById('initials').value = cleanInitials(rec.initials);
                document.getElementById('adate').value = cleanDate(rec.date);
                isSample = rec.sample === true;
                sampleCleared = rec.sampleCleared === true;
                // A record written by this version says which rows are Maya's, and
                // that list is the truth: it is kept row by row as the teacher works.
                // Only an older record, which never wrote one, has to be guessed at —
                // and then only when the sheet is unmistakably hers.
                sampleScoreKeys = Array.isArray(rec.sampleScoreKeys)
                    ? rec.sampleScoreKeys.map(String)
                    : (isSample && isReallySample(rec) ? skills.map(s => String(s.id)) : []);
                // Same rule for the Child box: this version writes down whether
                // those letters are the sample's leftovers, and that record is
                // the truth. An older one never wrote it, so it is worked out
                // the only safe way — the letters count as the sample's only on
                // a sheet that was unmistakably hers.
                sampleInitialsLeft = typeof rec.sampleInitials === 'boolean'
                    ? rec.sampleInitials
                    : (rec.sample === true && isReallySample(rec));
                // WHAT WAS WRONG: the saved "this is the sample" flag was believed
                // without ever being checked against what actually came back, so a
                // real child's assessment could reappear labelled, exported and
                // filed as Maya Torres with the real initials thrown away. The flag
                // only survives if some of Maya is really still on the page.
                leaveSampleIfGone(true);
            } else if (rec) {
                // Valid JSON of the wrong shape — an array, a number, a bare
                // string. It used to be dropped in silence while a half-written
                // record got a message; same total loss, so it gets the same
                // message.
                say('Some of what was saved on this laptop could not be read, so the ' +
                    'tool has started empty.', 20000, true);
            }

            if (rawUndo !== null) {
                let parsed = null;
                try { parsed = JSON.parse(rawUndo); } catch (e) { parsed = null; }
                undoState = cleanSnapshot(parsed);
            }
        }

        // ---------------------------------------------------------------------
        // The sample child
        // ---------------------------------------------------------------------
        function applySample() {
            scores = Object.assign({}, SAMPLE.scores);
            comments = { strengths: SAMPLE.strengths, stretches: SAMPLE.stretches };
            document.getElementById('initials').value = SAMPLE.initials;
            document.getElementById('adate').value = todayLocal();
            isSample = true;
            sampleScoreKeys = skills.map(s => String(s.id));
            sampleInitialsLeft = true;
        }

        // Is what is on screen still exactly Maya, untouched? Clearing her own
        // made-up scores costs nobody anything; clearing what a teacher has typed
        // over the top of them is a different matter.
        function sampleUntouched() {
            return isSample &&
                document.getElementById('initials').value === SAMPLE.initials &&
                document.getElementById('strengths').value === SAMPLE.strengths &&
                document.getElementById('stretches').value === SAMPLE.stretches &&
                skills.every(s => scores[s.id] === SAMPLE.scores[s.id]);
        }

        // Which skill rows are still holding the score Maya arrived with.
        function liveSampleScoreKeys() {
            return sampleScoreKeys.filter(k => scores[k] === SAMPLE.scores[k]);
        }

        // Is this saved record really Maya's sheet? Asked only of records old
        // enough not to say so themselves, and answered on evidence a real child
        // cannot produce by accident: her initials, plus either one of her notes
        // word for word (hundreds of characters nobody types by chance) or every
        // one of her six scores at once. A single matching letter is a
        // coincidence, not an identity, and it is not enough here.
        function isReallySample(rec) {
            if (cleanInitials(rec.initials).toUpperCase() !== SAMPLE.initials) return false;
            const c = cleanComments(rec.comments);
            if (c.strengths === SAMPLE.strengths || c.stretches === SAMPLE.stretches) return true;
            const s = cleanScores(rec.scores);
            return skills.every(sk => s[sk.id] === SAMPLE.scores[sk.id]);
        }

        // WHO THIS SHEET BELONGS TO. Three answers, not two:
        //   'sample' — it is Maya's, and it is filed as Maya's
        //   'part'   — the teacher has put their own initials on it, but some of
        //              Maya's made-up work is still on the page
        //   'child'  — the teacher's own, all of it
        //
        // WHAT WAS WRONG: there were only two answers, and anything with a scrap
        // of Maya left counted as the whole sample. A teacher who scored four of
        // the six rows, wrote both comments and typed K.P. over M.T. still had two
        // of Maya's scores on the sheet — so the PDF, the spreadsheet and the
        // printed header all called that child "Sample student — Maya Torres
        // (M.T.)" and both files were named sample-maya-torres-…, with K.P.
        // nowhere in either one. The child's own initials are never thrown away
        // now, and the sheet still says out loud which parts are made up.
        function sheetIdentity() {
            const typed = (document.getElementById('initials').value || '').trim().toUpperCase();
            if (!isSample) return { kind: 'child', initials: typed };
            // WHAT WAS ALSO WRONG, and it survived the fix above: this asked
            // "do the letters in the box say M.T.?" and called the WHOLE sheet
            // Maya's whenever they did. Some real children's initials genuinely
            // are M.T. A teacher who scored five of the six rows for such a
            // child, wrote both notes, and quite correctly left M.T. in the box
            // still had one of Maya's rows on the page — so the PDF and the
            // spreadsheet were named sample-maya-torres-…, every spreadsheet
            // row said "Sample student — Maya Torres (M.T.)", and the printed
            // header said "not a real child" over a real child's assessment.
            // Whose letters are in the box was never the question. The question
            // is whether any of this sheet is the teacher's own work about a
            // real child: a score they clicked, a note they wrote, or initials
            // that are not the sample's. The moment there is any, the sheet is
            // that child's — filed under their initials, with a part-sample
            // warning on it — whatever the letters in the box happen to be.
            // Emptying one of Maya's boxes is not work about a child, so it
            // does not on its own turn her sheet into somebody's assessment.
            const theirScore = skills.some(s =>
                scores[s.id] && sampleScoreKeys.indexOf(String(s.id)) === -1);
            const theirNote =
                (comments.strengths && comments.strengths !== SAMPLE.strengths) ||
                (comments.stretches && comments.stretches !== SAMPLE.stretches);
            const theirInitials = typed && typed !== SAMPLE.initials;
            if (!theirScore && !theirNote && !theirInitials) {
                return { kind: 'sample', initials: typed };
            }
            return { kind: 'part', initials: typed };
        }

        // The sentence that goes into the PDF and onto the paper, so no exported
        // sheet can be mistaken for a real child's record — whether it is all
        // Maya or only two rows of her.
        function sampleWarningLine() {
            const id = sheetIdentity();
            if (id.kind === 'sample') return SAMPLE_LABEL + ' — made-up data, not a real child.';
            if (id.kind === 'part') {
                return 'Part sample — still Maya Torres\'s made-up example, not ' +
                       id.initials + '\'s: ' + sampleTraceParts().join(', ') +
                       '. Everything else on this sheet is ' + id.initials + '\'s own.';
            }
            return '';
        }

        // The parts of Maya still on the page, named the way a teacher would.
        function sampleTraceParts() {
            const parts = [];
            const n = liveSampleScoreKeys().length;
            if (n) parts.push(n === 1 ? 'one of her scores' : n + ' of her scores');
            if (comments.strengths === SAMPLE.strengths) parts.push('her strengths note');
            if (comments.stretches === SAMPLE.stretches) parts.push('her stretches note');
            return parts;
        }

        // THE WORST THING THIS FILE HAS DONE, AND WHAT REPLACES IT:
        //
        // Typing your own initials over the sample used to run takeOverFromSample(),
        // which decided what was Maya's by comparing letters — so every score the
        // teacher had clicked that happened to match Maya's letter was DELETED,
        // while the message on screen said "What you filled in yourself is still
        // here." With six skills and three bands, about a third of a real child's
        // scores collide with Maya's by chance; in the worst run all six went. No
        // undo, and it survived a reload.
        //
        // Nothing is ever deleted now. A row stops being Maya's the moment the
        // teacher touches it (see touchScore), the banner says which parts of her
        // are still on the page, and the label comes off by itself once none of
        // her scores and neither of her notes are left. That also settles the
        // other half of it: a real child whose initials genuinely are M.T. used to
        // be filed forever as "Sample student — Maya Torres", because the only
        // escape was through the Child box.
        function leaveSampleIfGone(quiet) {
            if (!isSample) return false;

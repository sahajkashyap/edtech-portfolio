            if (sampleTraceParts().length > 0) return false;
            isSample = false;
            sampleScoreKeys = [];
            renderSample();
            if (!quiet) {
                // WHAT WAS WRONG: emptying the sample by hand instead of pressing
                // "Clear the sample" took the label off while M.T. was still
                // sitting in the Child box, put there by the sample and never
                // typed by anybody — and the tool said "This is your own
                // assessment now" over the top of it. The next export was named
                // social-emotional-MT-<date> and every spreadsheet row said
                // M.T., so a real child was filed under the made-up one's
                // initials. Those letters are not deleted — for some children
                // they are the right ones — but they are never passed off in
                // silence as something the teacher chose. See sampleInitialsNote.
                say('Nothing of the sample is left on this sheet, so the example label has ' +
                    'come off. This is your own assessment now.' +
                    (sampleInitialsStranded()
                        ? ' The Child box still says ' + SAMPLE.initials + ', which came ' +
                          'from the sample — change it if those are not this child\'s initials.'
                        : ''), sampleInitialsStranded() ? 16000 : 10000);
            }
            return true;
        }

        // Are the letters in the Child box the sample's leftovers rather than
        // anybody's choice? True only while all three hold: the example label is
        // off, the box has not been typed in since the sample put M.T. there,
        // and M.T. is still what it says.
        function sampleInitialsStranded() {
            return !isSample && sampleInitialsLeft &&
                (document.getElementById('initials').value || '').trim().toUpperCase()
                    === SAMPLE.initials;
        }

        // Said on the page rather than in a message that fades, because this
        // outlives the moment it happens in: it is still true after a reload,
        // and the export it would mislabel may be days later.
        function renderSampleInitialsNote() {
            const on = sampleInitialsStranded();
            const note = document.getElementById('sampleInitialsNote');
            if (on) {
                document.getElementById('sampleInitialsNoteText').innerHTML =
                    '<strong>The Child box still says ' + esc(SAMPLE.initials) + ', and those ' +
                    'letters came from the sample.</strong><br>Nothing else on this sheet is ' +
                    'made up. If ' + esc(SAMPLE.initials) + ' really is this child, type over ' +
                    'them and this note goes — otherwise the PDF, the spreadsheet, the printed ' +
                    'sheet and both filenames all file this assessment under the example ' +
                    'child\'s initials.';
            }
            // The keyboard must not be left standing on a button that has just
            // been hidden, or the next Tab jumps back to the top of the page.
            const btn = document.getElementById('dropSampleInitialsBtn');
            if (!on && !note.hidden && document.activeElement === btn) {
                document.getElementById('initials').focus();
            }
            note.hidden = !on;
        }

        // One press for the teacher who says "no, that was the sample's". It
        // empties the box and nothing else — every score and both notes stay.
        function dropSampleInitials() {
            document.getElementById('initials').value = '';
            sampleInitialsLeft = false;
            renderSample();
            saveToStorage();
            say('The Child box is empty. Put this child\'s own initials in it — they go ' +
                'on the printed sheet, in the PDF, in the spreadsheet and in both ' +
                'filenames.', 12000);
            document.getElementById('initials').focus();
        }

        function renderSample() {
            const on = isSample;
            document.getElementById('sampleBanner').classList.toggle('on', on);
            document.getElementById('sampleBtn').hidden = on;
            // While the sheet is still exactly Maya's the banner says so plainly.
            // Once a teacher has typed some of their own work over the top, it
            // says which parts are still hers, so a half-and-half sheet is never
            // exported as though all of it were made up.
            document.getElementById('sampleBannerText').innerHTML = on && sampleUntouched()
                ? '<strong>' + esc(SAMPLE_LABEL) + '</strong><br>Made-up scores, so you can ' +
                  'see what the tool does before you use it. Clear it when you are ready to ' +
                  'assess a real child.'
                : '<strong>Part sample — some of this is still Maya Torres, the made-up ' +
                  'example.</strong><br>Still hers: ' + esc(sampleTraceParts().join(', ')) +
                  '. Everything else on this sheet is yours, and ' +
                  (sheetIdentity().kind === 'part'
                    ? 'it prints and exports under your initials.'
                    : 'putting your own initials in the Child box files it under them.');
            renderSampleInitialsNote();
            renderPrintBits();
        }

        // "Try it with a sample student" sits first in the button row and wears
        // the kindest label on the page. It used to overwrite a real assessment on
        // one click: no question asked, no snapshot taken, and saved immediately,
        // so the real work was gone for good after a reload.
        function loadSample() {
            let stashed = null;
            if (hasWork()) {
                if (!confirm('Load the sample child?\n\nThe initials, every score and ' +
                             'both comment boxes on screen now are replaced by Maya ' +
                             'Torres\'s made-up ones.\n\nPress "Undo — bring mine back" ' +
                             'straight afterwards if that was not what you meant.')) return;
                stashed = snapshot('Undo — bring mine back');
            }
            applySample();
            sampleCleared = false;
            const ok = saveToStorage();
            if (stashed) offerUndo(stashed);
            renderSkills();
            updateChart();
            renderComments();
            renderSample();
            renderModal();
            say((stashed
                ? 'This is made-up data for Maya Torres. Your own assessment has not been ' +
                  'thrown away — press "Undo — bring mine back" to have it returned. '
                : 'This is made-up data for Maya Torres. Press "Clear the sample" when you ' +
                  'want to start your own. ') +
                (ok ? '' : 'This browser would not let the tool save, so nothing here will ' +
                           'survive a reload.'), 12000);
        }

        // WHAT WAS WRONG: this wiped the teacher's own scores and notes with no
        // question and no undo, and wrote the empty sheet to the laptop
        // immediately — while the first-visit message actively pointed them at it
        // ("Press Clear the sample when you want to start your own"). Every other
        // destructive path on this page asks first and keeps one step back. So
        // does this one now.
        function clearSample() {
            if (sampleUntouched()) {
                // Maya's own made-up data costs nobody anything. But if she was
                // loaded over somebody's assessment, that assessment is still owed
                // its way back — clearing her must not be what finally destroys it.
                const owed = undoState;
                wipe();
                if (owed) offerUndo(owed); else dropUndo();
                say(owed
                    ? 'Sample cleared. Your own assessment is one press of "' + owed.label + '" away.'
                    : 'Sample cleared. The tool is empty and ready for a real child.', 8000);
                return;
            }
            if (!confirm('Clear the sample student?\n\nWhat you have typed in over Maya goes ' +
                         'with her — the scores, both comment boxes and the initials. If you ' +
                         'want to keep a copy, cancel and export or print first.\n\n' +
                         '"Undo — put my assessment back" brings it straight back.')) return;
            const keep = snapshot('Undo — put my assessment back');
            const ok = wipe();
            offerUndo(keep);
            say(ok
                ? 'Sample cleared. Press "Undo — put my assessment back" if that was not what ' +
                  'you meant.'
                : 'The sheet on screen is empty, but this browser would not let the tool save, ' +
                  'so the copy on the laptop is still there and a reload brings it back.', 20000);
        }

        // ---------------------------------------------------------------------
        // Clearing, and getting it back
        // ---------------------------------------------------------------------
        // Is there anything on this screen a person would be sorry to lose? The
        // date counts: a teacher who set the date and nothing else used to be
        // told there was nothing to clear.
        function hasWork() {
            readComments();
            const d = dateValue();
            return skills.some(s => scores[s.id]) ||
                   !!comments.strengths || !!comments.stretches ||
                   !!document.getElementById('initials').value ||
                   // A date the TEACHER chose is work. Today's date, which the
                   // tool fills in by itself on an empty sheet, is not — or Reset
                   // All would offer to clear a sheet with nothing on it.
                   (!!d && d !== todayLocal());
        }

        function snapshot(label) {
            readComments();
            return {
                scores: JSON.parse(JSON.stringify(scores)),
                comments: { strengths: comments.strengths, stretches: comments.stretches },
                initials: document.getElementById('initials').value,
                date: dateValue(),
                sample: isSample,
                sampleScoreKeys: sampleScoreKeys.slice(),
                sampleInitials: sampleInitialsLeft,
                label: label
            };
        }

        // Hold one step of Undo, and hold it in storage as well as in memory.
        // Returns whether the way back really reached the disk, so the caller can
        // tell the truth about it.
        function offerUndo(snap) {
            undoState = snap;
            renderUndo();
            try { localStorage.setItem(K_UNDO, JSON.stringify(snap)); return true; }
            catch (err) { return false; }   // still works while this tab stays open
        }

        function dropUndo() {
            undoState = null;
            try { localStorage.removeItem(K_UNDO); } catch (err) { /* nothing to remove */ }
            renderUndo();
        }

        function renderUndo() {
            const btn = document.getElementById('undoBtn');
            // The button was hidden while the keyboard was still sitting on it,
            // so focus was left on an invisible control and the next Tab jumped
            // back to the top of the page.
            if (!undoState && !btn.hidden && document.activeElement === btn) {
                const back = document.getElementById('sampleBtn');
                if (back && !back.hidden) back.focus();
            }
            btn.hidden = !undoState;
            btn.textContent = undoState ? undoState.label : 'Undo the clear';
        }

        // Empty the sheet. Nothing here asks anything — every caller has already
        // decided it is safe. Returns whether the empty sheet reached the disk.
        function wipe() {
            scores = {};
            comments = { strengths: '', stretches: '' };
            document.getElementById('initials').value = '';
            document.getElementById('adate').value = todayLocal();
            if (isSample) sampleCleared = true;
            isSample = false;
            sampleScoreKeys = [];
            sampleInitialsLeft = false;   // the box has just been emptied
            const ok = saveToStorage();
            renderSkills();
            updateChart();
            renderComments();
            renderSample();
            renderModal();
            return ok;
        }

        function resetAll() {
            // Pressing Reset on an already-empty tool used to take a fresh
            // snapshot of that emptiness and put it over the top of the real one,
            // so "Undo the clear" then said "Put back." and put back nothing at
            // all — the work was gone, with a message saying it had been restored.
            if (!hasWork()) {
                say(undoState
                    ? 'There is nothing to clear — this assessment is already empty. ' +
                      'What you had before is still waiting under "' + undoState.label + '".'
                    : 'There is nothing to clear — this assessment is already empty.', 8000);
                return;
            }

            if (!confirm('Clear this assessment?\n\nThe initials, every score and both ' +
                         'comment boxes are emptied.\n\nPress "Undo the clear" straight ' +
                         'afterwards if that was not what you meant.')) return;

            // WHAT WAS WRONG: this skipped the snapshot whenever isSample was
            // true and an undo already existed, on the assumption that the screen
            // held nothing but Maya's made-up data. That stopped being true the
            // moment a teacher typed over her — and the banner stays up while
            // they do — so Reset All could destroy a full real assessment with no
            // snapshot anywhere, while the message it printed named an undo that
            // restored a different, older child. The screen is snapshotted unless
            // it really is still nothing but Maya AND an earlier assessment is
            // still owed its way back.
            const owed = (undoState && sampleUntouched()) ? undoState : null;
            const keep = owed || snapshot('Undo the clear');

            const ok = wipe();
            const undoSaved = offerUndo(keep);

            if (!ok) {
                say('This browser would not let the tool save, so the sheet on screen is ' +
                    'empty but the saved copy is still there — reloading brings it back. ' +
                    'Print or export what you need, then close the tab.', 120000, true);
                return;
            }
            say('Everything cleared. Press "' + keep.label + '" if that was not what you ' +
                'meant. ' + (undoSaved
                    ? 'It survives a reload.'
                    : 'It works while this tab stays open — this browser would not let the ' +
                      'tool save the way back, so do not reload until you are sure.'), 20000);
        }

        function undoReset() {
            if (!undoState) return;

            // WHAT WAS WRONG, AND IT WAS THE WORST THING ON THIS PAGE: the button
            // and its snapshot were never retired. After a Reset All the button
            // stayed on screen for the rest of the session and the message beside
            // it went on telling the teacher to press it — so pressing it part-way
            // through the NEXT child's assessment silently replaced that child
            // with the previous one, permanently, and a reload confirmed it.
            // It asks first now, and what it is about to replace is itself
            // offered back, so a second press returns the page you were on.
            const replacing = hasWork() ? snapshot('Undo — put back what was on screen') : null;
            if (replacing && !confirm('Put the earlier assessment back?\n\nWhat is on this ' +
                    'page now — the initials, the date, every score and both comment boxes — ' +
                    'is replaced by it.\n\nOne more Undo brings this page back.')) return;

            scores = undoState.scores;
            comments = undoState.comments;
            isSample = undoState.sample;
            sampleScoreKeys = undoState.sampleScoreKeys || [];
            sampleInitialsLeft = undoState.sampleInitials === true;
            document.getElementById('initials').value = undoState.initials;
            document.getElementById('adate').value = undoState.date;

            if (replacing) offerUndo(replacing); else dropUndo();

            leaveSampleIfGone(true);
            saveToStorage();
            renderSkills();
            updateChart();
            renderComments();
            renderSample();
            renderModal();
            say('Put back.', 5000);
        }

        // ---------------------------------------------------------------------
        // Getting it off the screen: PDF, spreadsheet, paper
        // ---------------------------------------------------------------------
        function whoLine() {
            const id = sheetIdentity();
            if (id.kind === 'sample') return SAMPLE_LABEL;
            // A half-taken-over sheet is filed under the child whose initials are
            // in the box — with "part sample" beside them, and the full sentence
            // about which parts are made up on the line underneath.
            return 'Child: ' + (id.initials || '—') +
                   (id.kind === 'part' ? ' — part sample' : '');
        }

        // Initials and the date go in the filename as well as in the file. Every
        // export used to be called the same thing, so a second child's sheet
        // landed in the downloads folder as a copy of the first.
        function fileStem() {
            // WHAT WAS WRONG: this kept only A-Z and 0-9, so initials with an
            // accent or in a non-Latin script — Á.Ñ., 李明 — were stripped to
            // nothing and every such child on the same day got the identical
            // filename "…-no-initials-<date>", while the file's own contents
            // named them. Every letter and digit is kept now, in whatever
            // alphabet it is written in; only punctuation and spacing goes.
            const typed = (document.getElementById('initials').value || '')
                .toUpperCase().replace(/[^\p{L}\p{N}]+/gu, '');
            const date = dateValue() || 'no-date';
            const kind = sheetIdentity().kind;
            if (kind === 'sample') return 'sample-maya-torres-social-emotional-' + date;
            // WHAT WAS WRONG: a sheet the teacher had only half typed over went
            // into the downloads folder as sample-maya-torres-… with their own
            // initials nowhere in the name. Both facts fit in a filename: whose
            // sheet it is, and that part of it is still the made-up example.
            // A half-taken-over sheet with an empty Child box would otherwise be
            // called "part-sample-social-emotional--2026-08-12", with a hole
            // where the initials go and every such sheet on one day sharing it.
            if (kind === 'part') {
                return 'part-sample-social-emotional-' + (typed || 'no-initials') + '-' + date;
            }
            return 'social-emotional-' + (typed || 'no-initials') + '-' + date;
        }

        // jsPDF's built-in fonts only know the first 256 characters and do not
        // say so — one arrow or tick pasted into a comment box turns that whole
        // line of the exported PDF into spaced-out gibberish.
        function pdfSafe(s) {
            return String(s)
                .replace(/[‘’‚′]/g, "'")
                .replace(/[“”„″]/g, '"')
                .replace(/[–—]/g, '-')
                .replace(/…/g, '...')
                .replace(/[^\x00-\xFF]/g, '?');
        }

        function exportPDF() {
            readComments();
            saveToStorage();

            // The library is on a CDN. When a school firewall blocks it the button
            // used to throw into the console and look broken forever.
            if (window.__pdfLibBlocked || !window.jspdf || !window.jspdf.jsPDF) {
                say('The PDF part of this page could not load — it comes from the ' +
                    'internet, and this network or this moment blocked it. Everything ' +
                    'else still works: "Print" makes the same sheet on paper or as a ' +
                    'PDF from the print box, and "Export as CSV" saves it for a ' +
                    'spreadsheet. Both work with no internet at all.', 30000);
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const pageHeight = doc.internal.pageSize.getHeight();
                const pageWidth = doc.internal.pageSize.getWidth();
                const BOTTOM = pageHeight - 18;
                let yPos = 15;

                // WHAT WAS WRONG: nothing asked whether there was room left on the
                // page except at the very END of the skills loop, after the line
                // had already been drawn. Two long comments pushed "Skills
                // Assessment:" and the first of the six skills below the bottom
                // edge of page one, where jsPDF simply does not draw them — the
                // exported record showed five skills while the screen, the CSV and
                // the printed sheet all showed six. Longer than that and hundreds
                // of words of the teacher's own notes ran off the paper and were
                // in no page of the file at all. Everything is drawn through these
                // two helpers now, and both start a new page before they run off.
                const room = need => {
                    if (yPos + need > BOTTOM) { doc.addPage(); yPos = 15; }
                };
                const write = (text, size, gap) => {
                    doc.setFontSize(size);
                    const lines = doc.splitTextToSize(pdfSafe(text), pageWidth - 30);
                    const step = size >= 12 ? 6 : 5;
                    lines.forEach(line => {
                        room(step);
                        doc.text(line, 15, yPos);
                        yPos += step;
                    });
                    yPos += (gap || 0);
                };

                doc.setFontSize(20);
                doc.text('Social-Emotional Assessment', pageWidth / 2, yPos, { align: 'center' });
                yPos += 10;

                // Who and when. The date says exactly what the screen, the CSV and
                // both filenames say — it used to print "—" while its own filename
                // carried today.
                doc.setFontSize(12);
                doc.text(pdfSafe(whoLine()), 15, yPos);
                doc.text('Date: ' + (dateValue() || NO_DATE), pageWidth - 15, yPos, { align: 'right' });
                yPos += 8;

                const sampleWarning = sampleWarningLine();
                if (sampleWarning) {
                    write(sampleWarning, 10, 2);
                }

                const c = counts();
                write(`Emerging: ${c.e} | Developing: ${c.d} | Mastered: ${c.m} | ` +
                      `Not yet scored: ${c.x}`, 11, 4);

                write('Strengths:', 12, 0);
                write(document.getElementById('strengths').value || '(No strengths recorded)', 10, 5);

                write('Stretches: Areas of Growth:', 12, 0);
                write(document.getElementById('stretches').value || '(No areas of growth recorded)', 10, 8);

                write('Skills Assessment:', 12, 0);
                skills.forEach(skill => {
                    // "Not yet scored", spelled the way the tile, the panel and the
                    // spreadsheet spell it. The PDF used to call the same state
                    // "Not Assessed" while its own summary line above said "Not yet
                    // scored" — one state, two names, in the two things a teacher
                    // actually files.
                    const score = scores[skill.id];
                    write(`${skill.label} — ${bandNames[score] || bandNames.x}`, 10, 1);
                });

                doc.save(fileStem() + '.pdf');
                say('PDF saved as ' + fileStem() + '.pdf', 8000);
            } catch (err) {
                say('The PDF did not get made on this computer. "Print" (your browser can ' +
                    'save the page as a PDF) and "Export as CSV" both still work.', 30000);
            }
        }

        // A cell that holds a comma, a quote or a line break has to be quoted, or
        // one comment shunts every column after it along by one.
        function csvCell(v) {
            v = (v === null || v === undefined) ? '' : String(v);
            return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        }

        function exportCSV() {
            // Read the boxes first: the spreadsheet has to hold everything on the
            // screen, comments included.
            readComments();
            saveToStorage();
            const c = counts();
            const initials = (document.getElementById('initials').value || '').toUpperCase();
            // The same date the filename, the screen and the PDF use.
            const dateShown = dateValue() || NO_DATE;
            const id = sheetIdentity();
            // The Child column carries both facts on every row: whose sheet it is,
            // and — on a sheet only half typed over — that some of the scores are
            // still the made-up example's. It used to carry only the sample label,
            // so a real child's initials never reached the spreadsheet at all.
            const who = id.kind === 'sample' ? SAMPLE_LABEL
                      : id.kind === 'part'
                        ? (initials || '—') + ' — part sample, some scores are still ' +
                          'Maya Torres\'s made-up ones'
                      : (initials || '—');

            const head = ['Child', 'Date', 'Skill', 'Score', 'Emerging', 'Developing',
                          'Mastered', 'Not yet scored', 'Strengths', 'Stretches'];
            const rows = [head.map(csvCell).join(',')];

            // Every row repeats the child, the date, the counts and both comments.
            // It is a little wasteful, and it means whichever row a spreadsheet
            // filter happens to leave on screen still says who it is about and
            // when. The two comment columns are the one place a cell can be
            // empty: if the teacher wrote nothing, nothing is invented here.
            skills.forEach(skill => {
                rows.push([
                    who, dateShown, skill.label,
                    bandNames[scores[skill.id]] || bandNames.x,
                    c.e, c.d, c.m, c.x,
                    comments.strengths, comments.stretches
                ].map(csvCell).join(','));
            });

            const csv = '﻿' + rows.join('\r\n');      // BOM so Excel reads accents
            const a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = fileStem() + '.csv';
            document.body.appendChild(a); a.click(); a.remove();

            // WHAT WAS WRONG: when the browser was refusing to store anything, the
            // standing "THIS ASSESSMENT IS NOT BEING SAVED" warning told the
            // teacher to export before closing the tab — and doing so replaced the
            // warning with the single word "Saved", which then faded to an empty
            // message bar. The tool's own success message erased a warning that
            // was still true.
            if (notSaving) {
                say('Spreadsheet downloaded as ' + fileStem() + '.csv — and this assessment ' +
                    'is still NOT being saved on this laptop. Keep the tab open until you ' +
                    'have everything you need.', 120000, true);
            } else {
                say('Spreadsheet saved as ' + fileStem() + '.csv', 8000);
            }
        }

        function printSheet() {
            readComments();
            saveToStorage();
            renderPrintBits();
            window.print();
        }

        // ---------------------------------------------------------------------
        // Event listeners for auto-save
        // ---------------------------------------------------------------------
        // 'input', not 'change'. On 'change' a comment was only stored when the box
        // lost focus, so ten minutes of careful notes were thrown away by a closed
        // tab or a sleeping iPad — while the scores beside them had saved instantly
        // all along.
        ['strengths', 'stretches'].forEach(id =>
            document.getElementById(id).addEventListener('input', () => {
                readComments();
                leaveSampleIfGone();
                renderSample();
                saveToStorage();
            }));

        // WHAT WAS WRONG: one Backspace inside the date box makes its value '',
        // and that empty string went straight over the saved date with nothing
        // said, so an assessment recorded for 4 May came back dated today. The
        // blank is still saved — the teacher may have meant it — but it is said
        // out loud, and a blank date now stays blank on screen, on paper, in both
        // exports and in both filenames instead of quietly becoming today.
        document.getElementById('adate').addEventListener('input', () => {
            const now = dateValue();
            if (!now && lastGoodDate) {
                say('The date box is empty now, so this assessment will be filed with ' +
                    'no date until you fill it in. It was ' + lastGoodDate + '.', 12000);
            }
            lastGoodDate = now || lastGoodDate;
            readComments();
            saveToStorage();
        });

        const initialsBox = document.getElementById('initials');

        // The sample arrives with M.T. already filling all four characters the box
        // will hold. Clicking in it and typing therefore did absolutely nothing —
        // every keystroke was refused for being a fifth character, and a triple
        // click on such a short value leaves a caret, not a selection. "Just type
        // over it" is the obvious thing to do, so it has to work: while the sample
        // is on screen, clicking into the box selects what is there.
        // Once the teacher's own initials are in the box, clicking back into it
        // must NOT select them — the next keystroke would wipe what they typed.
        // (It also has to work once the example label has come off with M.T.
        // still in the box — the box is just as full, and the teacher is just as
        // likely to try to type over it.)
        initialsBox.addEventListener('focus', () => {
            if (sampleInitialsLeft && initialsBox.value === SAMPLE.initials) initialsBox.select();
        });

        // Typing initials no longer deletes anything at all. See leaveSampleIfGone.
        initialsBox.addEventListener('input', () => {
            readComments();
            // Whatever is in the box now, the teacher put it there — including
            // M.T., if that is genuinely this child. It stops being the sample's
            // leftover the moment a key is pressed in this box.
            sampleInitialsLeft = false;
            renderSample();
            saveToStorage();
        });

        // Cmd-P and File > Print never touch printSheet(), so the paper copies of
        // the comment boxes and the header line are brought up to date here too.
        window.addEventListener('beforeprint', renderPrintBits);

        // WHAT WAS WRONG: this closed the panel on any click whose target was the
        // dark backdrop — and when a mouse press and release land on different
        // elements Chrome dispatches the click to their common ancestor, which is
        // the backdrop. So dragging a text selection across the skill list closed
        // the panel and threw the selection away the moment the mouse came up
        // outside the white box: the skills in a band could not be copied.
        let pressedOnBackdrop = false;
        window.addEventListener('mousedown', (e) => {
            pressedOnBackdrop = (e.target === document.getElementById('modal'));
        });
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal') && pressedOnBackdrop) closeModal();
            pressedOnBackdrop = false;
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            trapTab(e);
        });

        // WHAT WAS WRONG: with the tool open in two tabs, one keystroke in the
        // older tab wrote its whole stale sheet over everything the newer tab had
        // saved — silently, with the older tab still showing a record that no
        // longer existed on the laptop, and no undo anywhere because undoState
        // lives in the page. A tab that has been overtaken stops saving and says
        // so, rather than quietly winning the race.
        window.addEventListener('storage', (e) => {
            if (e.key !== K_RECORD || e.newValue === null) return;
            if (e.newValue === lastWritten) return;   // our own write echoing back
            otherTabSaved = true;
            say('This assessment is open in another tab, and that tab has just saved a ' +
                'change. To stop the two tabs writing over each other, this tab has ' +
                'stopped saving. Print or export anything here that you need, then close ' +
                'this tab and reload the other one.', 600000, true);
        });

        // Initialize on load
        init();
    </script>
</body>
</html>

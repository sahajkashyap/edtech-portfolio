<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Assessment</title>
    <meta name="description" content="A one-page writing assessment sheet for a K-2 classroom. Score seven writing skills, write strengths and next steps, print or export. Everything stays on the laptop it is opened on.">
    <meta property="og:title" content="Writing Assessment">
    <meta property="og:description" content="Score seven writing skills, write strengths and next steps, print or export. Nothing leaves the laptop.">
    <meta property="og:type" content="website">
    <!-- WHAT WAS WRONG: no favicon at all, so the tab showed a blank page icon
         and every load asked the server for /favicon.ico and got a 404. The
         icon is drawn here as text, so it costs no request and works offline. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23378ADD'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Helvetica,Arial,sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EW%3C/text%3E%3C/svg%3E">
    <!-- jsPDF is the only thing here that comes off the internet, and it is
         optional. If a school firewall or an offline laptop stops it loading,
         exportPDF() says so in plain words and points at Print and CSV, which
         need nothing. It used to throw into the console and look like a dead
         button. Everything else in this file is self-contained.

         WHAT WAS WRONG: this was a plain <script> in the head, which stops the
         browser drawing anything until it answers. On a network that silently
         swallows the request — a school filter that drops rather than refuses —
         the whole page was blank white for as long as the request hung. `defer`
         lets the page draw first and the optional extra arrive whenever it
         arrives, or never. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #E8D4C4;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 12px;
        }

        .who-row {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .who {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .who label {
            font-size: 13px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .who input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #999;
            border-radius: 4px;
        }

        #initials {
            width: 80px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .privacy {
            font-size: 12.5px;
            color: #639922;
            font-weight: bold;
        }

        /* The sample child has to be unmistakable on screen and on paper, so a
           printed sheet can never be filed as a real child's record. */
        .sampleflag {
            display: none;
            margin: 12px auto 0;
            max-width: 560px;
            background: #BA7517;
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 4px;
        }

        /* WHAT WAS WRONG: the only sentence telling a first-time visitor how to
           start their own assessment named a button 1000px below the fold, and
           it deleted itself after ten seconds. The way out of the sample now
           sits inside the banner that announces the sample, where it is on
           screen the whole time she is. */
        .sampleflag button {
            margin-left: 10px;
            background: white;
            color: #7a4b00;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 32px;
        }

        .sampleflag button:hover { background: #F3EFE7; }

        /* WHAT WAS WRONG: this block grew and shrank with the length of the
           message in it, so the whole page jumped up to 28px on a phone the
           moment a message expired — and a finger already on its way down to a
           score button landed on nothing. The wrapper holds a fixed height and
           the message is laid over it, so no message appearing or going away
           can move anything on the page. */
        .saved-wrap {
            position: relative;
            min-height: 42px;
            margin-top: 10px;
        }

        .saved {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            font-size: 13.5px;
            color: #7a4b00;
            font-weight: 600;
            max-width: 780px;
            margin-left: auto;
            margin-right: auto;
        }

        /* A browser with JavaScript switched off used to show two empty panels
           and five buttons that did nothing at all, with nothing to explain it. */
        .noscript {
            max-width: 640px;
            margin: 0 auto 20px;
            background: #BA7517;
            color: white;
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-box {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .chart-box h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* WHAT WAS WRONG: `cursor: pointer` on the whole svg gave the empty grey
           "nothing scored yet" ring a hand cursor, so it looked like a control
           on a sheet where it does nothing at all. Only a real slice is a
           button, and drawPie() sets the hand cursor on those. */
        svg {
            cursor: default;
            max-width: 100%;
            height: auto;
        }

        .chart-note {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
            min-height: 18px;
        }

        .count-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .count-box {
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
            font-family: inherit;
        }

        .count-box.emerging {
            background-color: #378ADD;
            color: white;
        }

        .count-box.developing {
            background-color: #BA7517;
            color: white;
        }

        .count-box.mastered {
            background-color: #639922;
            color: white;
        }

        .count-box:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .right-panel {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
        }

        .right-panel h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skill-item {
            background: white;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Wraps rather than squeezes, so the finger-sized buttons below can
               drop under the label on a narrow phone instead of pushing the
               page sideways. */
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid #ddd;
        }

        .skill-key {
            font-size: 12.5px;
            color: #666;
            margin-bottom: 12px;
        }

        .skill-label {
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        .skill-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .score-btn {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            background-color: white;
            color: #666;
        }

        .score-btn:hover {
            background-color: #f5f5f5;
        }

        .score-btn.e {
            background-color: #378ADD;
            color: white;
            border-color: #378ADD;
        }

        .score-btn.d {
            background-color: #BA7517;
            color: white;
            border-color: #BA7517;
        }

        .score-btn.m {
            background-color: #639922;
            color: white;
            border-color: #639922;
        }

        /* A wrong tap has to be undoable without wiping the sheet. Clicking the
           same letter again already cleared it, but nothing on screen said so,
           so this button spells it out. */
        .clear-score {
            margin-left: 4px;
            padding: 5px 8px;
            border: 1px solid #ccc;
            background: white;
            color: #888;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        /* WHAT WAS WRONG: the × only existed once a row was scored, so scoring a
           row made it appear and shoved E, D and M 35px to the left. A second
           tap in the same PLACE — which is what "tap the same letter again to
           clear it" tells you to do — landed on the next letter along, and the
           tool silently recorded a band higher than the one under the finger.
           The × is always in the row now and merely invisible when there is
           nothing to clear, so nothing ever moves sideways under a finger.
           `visibility: hidden` and not `display: none` on purpose: it keeps the
           space AND takes the button out of the keyboard's path. */
        .clear-score.empty {
            visibility: hidden;
        }

        .clear-score:hover {
            background: #f5f5f5;
            color: #333;
        }

        /* WHAT WAS WRONG: on the device this tool is built for — an iPad in
           portrait — E, D and M were 30x28 and the × was 25x24, on the control
           a teacher taps seven times per child while watching a child write.
           Anything driven by a finger rather than a mouse gets Apple's 44px.

           AND THEN: that promise was only ever kept for E, D, M and the ×.
           Everything else on the page a finger has to hit was still under it —
           "Clear the sample student" in the orange banner was 32px tall, the
           five buttons at the bottom 40, Close on a pop-up panel 32, and the
           Child and Date boxes 34 and 36. The rule below now names every one of
           them, so "anything driven by a finger" is the whole page, not a
           corner of it. */
        @media (pointer: coarse) {
            .score-btn, .clear-score,
            .btn, #undoBtn, .sampleflag button, .close-btn {
                min-width: 44px;
                min-height: 44px;
            }
            /* Boxes you tap to type in, not buttons — height only. Giving the
               initials box a 44px minimum WIDTH as well would do nothing but
               make a four-character box wider than it needs to be. */
            .who input { min-height: 44px; }
            .skill-buttons { gap: 8px; }
        }

        .comments-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .comment-box {
            background: #F3EFE7;
            padding: 20px;
            border-radius: 8px;
        }

        .comment-box h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .comment-box textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            background-color: #E3F2FD;
            resize: vertical;
        }

        .comment-box textarea:focus {
            outline: none;
            border-color: #378ADD;
            box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
        }

        /* Only ever seen on paper. See the print rules at the bottom. */
        .print-copy {
            display: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.45;
            color: #222;
        }

        /* A pie slice is a real control now, so it has to show where the
           keyboard is. SVG gets no focus ring of its own worth seeing. */
        #pieChart [tabindex]:focus {
            outline: 3px solid #333;
            outline-offset: 2px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #378ADD;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2a6bb3;
            box-shadow: 0 2px 8px rgba(55, 138, 221, 0.3);
        }

        .btn-secondary {
            background-color: #666;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        .btn-sample {
            background-color: #639922;
            color: white;
        }

        .btn-sample:hover {
            background-color: #527f1c;
        }

        /* WHAT WAS WRONG: Undo used to sit inside the centred row above. The row
           re-centred itself the instant Undo appeared or disappeared, sliding
           every button about 65px sideways — so "Clear this assessment" landed
           exactly where the pointer had just pressed "Undo clear", and a second
           click in the same spot fired the destructive one. Undo has its own
           row now, below the others, and that row keeps its height whether the
           button is in it or not, so nothing else can move. */
        .undo-row {
            display: flex;
            justify-content: center;
            min-height: 46px;
            margin-top: 10px;
        }

        #undoBtn {
            display: none;
            background-color: #BA7517;
            color: white;
        }

        #undoBtn:hover {
            background-color: #9d6213;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 0;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 20px;
            border-left: 4px solid #378ADD;
            background: #F3EFE7;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-skills {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-skill {
            padding: 10px;
            background: #F3EFE7;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }

        .modal-empty {
            font-size: 14px;
            color: #555;
        }

        .modal-footer {
            padding: 15px 20px;
            background: #F3EFE7;
            text-align: right;
            border-top: 1px solid #e0e0e0;
        }

        .close-btn {
            background: #666;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-btn:hover {
            background: #555;
        }

        /* A visitor who has asked their system to stop things moving should not
           get a panel that slides and fades at them anyway. */
        @media (prefers-reduced-motion: reduce) {
            *, .modal, .modal-content, .count-box, .btn, .score-btn {
                animation: none !important;
                transition: none !important;
            }
            .count-box:hover { transform: none !important; }
        }

        @media (max-width: 1024px) {
            /* minmax(0, 1fr), not 1fr. A plain 1fr will not shrink a column
               below the widest thing inside it, so on a narrow phone the two
               panels stayed 336px wide and the whole page slid sideways. */
            .main-content {
                grid-template-columns: minmax(0, 1fr);
            }

            .comments-section {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        /* WHAT WAS WRONG: at 320px and 360px the page scrolled sideways — the
           three count tiles plus the body's 30px padding needed 366px and there
           were only 320. Everything below just gives that width back. */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 24px; }
            .main-content, .comments-section { gap: 16px; }
            .chart-box, .right-panel, .comment-box { padding: 14px; }
            .count-boxes { gap: 6px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .count-box { padding: 10px 4px; font-size: 12px; }
            .skill-item { padding: 10px; }
            .skill-label { font-size: 13px; }
            .score-btn { padding: 6px 8px; }
            /* Messages take more lines on a narrow screen, so the reserved block
               is deeper here. It only has to look right — the message is laid
               over it, so even a message longer than this cannot move anything. */
            .saved-wrap { min-height: 58px; }
        }

        /* Only ever seen on paper: the plain-text stand-ins for the two header
           boxes, and the same identifying line repeated on the second sheet. */
        .print-only { display: none; }

        @media print {
            body { background: white; padding: 0; }
            .button-group, .undo-row, .privacy, .saved-wrap, .modal, .noscript { display: none !important; }
            .chart-box, .right-panel, .comment-box { background: white; }

            .print-only { display: block; }

            /* WHAT WAS WRONG: the printed record is always two sheets, and
               sheet 2 — which carries both narrative comment boxes, the part
               most likely to be photocopied for a family meeting — had no
               initials, no date and no sample warning anywhere on it. A page of
               writing about a child with nothing saying which child it is. */
            #sheetTwoId {
                font-size: 13px;
                font-weight: 700;
                color: #222;
                margin-bottom: 12px;
                padding-bottom: 6px;
                border-bottom: 1px solid #999;
                grid-column: 1 / -1;
            }

            /* WHAT WAS WRONG: a blank sheet printed to be filled in by hand came
               out with the placeholder "J.M." sitting in the Child box, so it
               read as a record that already belonged to a child. And the native
               date box printed its calendar-picker glyph — a screen control on a
               piece of paper. Both boxes are replaced on paper by plain text. */
            #initials, #wdate { display: none !important; }
            .who-print { display: inline; font-size: 14px; color: #222; font-weight: 600; }

            /* AND THEN: with the boxes gone, a sheet printed blank to be filled
               in by hand said "—" where the initials go and the words "no date"
               where the date goes — the tool answering a question the paper was
               there to ask. An empty box on paper is a ruled line you write on,
               with its label beside it saying what to write. So the labels stay
               on paper (they used to be hidden along with the boxes), and an
               empty stand-in becomes the line. */
            .who label { display: inline; }
            .who-print:empty {
                display: inline-block;
                min-width: 110px;
                min-height: 1.2em;
                border-bottom: 1px solid #444;
            }

            /* A dead × beside every skill row is screen furniture, not a record. */
            .clear-score { display: none !important; }

            /* WHAT WAS WRONG: on Chrome's default print settings background
               graphics are off, so the orange sample banner and the three
               coloured count tiles lost their backgrounds and printed their
               white text as pale grey — the faintest marks on the page. The one
               safeguard against a made-up child's sheet being filed as real was
               the first thing to vanish on paper. On paper they are dark ink on
               white with a heavy border, which needs no background at all. */
            .sampleflag {
                background: white !important;
                color: #7a4b00 !important;
                border: 3px solid #7a4b00;
                font-weight: 700;
            }
            .sampleflag button { display: none !important; }
            .count-box {
                background: white !important;
                color: #222 !important;
                border: 2px solid #444;
            }
            /* WHAT WAS WRONG: a textarea prints only the slice that fits its own
               scroll box, so anything past about 760 characters never reached
               the paper and nothing on the page said so. Paper has no
               scrollbar. On paper the box is replaced by the plain text, which
               flows and wraps and cannot be cut off. */
            .comment-box textarea { display: none !important; }
            /* Bordered and never shorter than a few lines, so a sheet printed
               with the boxes still empty is something a teacher can write on by
               hand — which is what the empty box used to give them. */
            /* min-height 120px -> 200px: 120px was sized against the 13px
               printed type — about three handwritten lines once a real pen is
               on the paper. The boxes already start the second sheet, which
               has the room to spare; this spends it on the pen instead of on
               white space. Same paper pass as the phonics worksheet fix. */
            .print-copy {
                display: block;
                min-height: 200px;
                border: 1px solid #999;
                border-radius: 4px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <noscript>
        <div class="noscript">
            This page needs JavaScript switched on to work. With it off, the
            score buttons and the export buttons below do nothing. Turn
            JavaScript on for this page and reload, or print this sheet and fill
            it in by hand.
        </div>
    </noscript>

    <div class="container">
        <div class="header">
            <h1>Writing Assessment</h1>
            <div class="who-row">
                <!-- Initials, not a name. Nothing here identifies a child to
                     anyone outside the classroom, and nothing leaves this
                     laptop. -->
                <div class="who">
                    <label for="initials">Child</label>
                    <input type="text" id="initials" maxlength="4" placeholder="J.M." autocomplete="off">
                    <!-- What the printer gets instead of the box. See the print
                         rules: the box itself prints its placeholder and its
                         calendar glyph, neither of which belongs on paper. -->
                    <span class="print-only who-print" id="initialsPrint"></span>
                </div>
                <div class="who">
                    <label for="wdate">Date</label>
                    <input type="date" id="wdate" min="1900-01-01" max="2999-12-31">
                    <span class="print-only who-print" id="datePrint"></span>
                </div>
                <div class="privacy">● Stays on this laptop</div>
            </div>
            <div class="sampleflag" id="sampleFlag"><span id="sampleFlagText">Sample student — Maya Torres (example data, not a real child)</span><button type="button" id="bannerClearBtn" onclick="toggleSample()">Clear the sample student</button></div>
            <div class="saved-wrap">
                <!-- role="status": the same line reports a save, an export and
                     the "not being saved" warning, and none of it was announced
                     to anybody using a screen reader. -->
                <div class="saved" id="savedmsg" role="status" aria-live="polite"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="chart-box">
                    <h3>Assessment Overview</h3>
                    <svg id="pieChart" viewBox="0 0 200 200" style="width: 180px; height: 180px;"></svg>
                    <div class="chart-note" id="chartNote"></div>
                    <div class="count-boxes">
                        <button type="button" class="count-box emerging" id="countEmerging" onclick="openModal('e')">
                            <div id="countEText">Emerging</div>
                            <div id="numEmerging">0</div>
                        </button>
                        <button type="button" class="count-box developing" id="countDeveloping" onclick="openModal('d')">
                            <div id="countDText">Developing</div>
                            <div id="numDeveloping">0</div>
                        </button>
                        <button type="button" class="count-box mastered" id="countMastered" onclick="openModal('m')">
                            <div id="countMText">Mastered</div>
                            <div id="numMastered">0</div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <h3>Writing Skills Assessment</h3>
                <!-- Nothing on the page ever said what E, D and M stand for. -->
                <div class="skill-key">E = Emerging · D = Developing · M = Mastered · × clears a score</div>
                <div class="skills-list" id="skillsList"></div>
            </div>
        </div>

        <div class="comments-section">
            <div class="print-only" id="sheetTwoId"></div>
            <div class="comment-box">
                <h3>Strengths</h3>
                <textarea id="strengths" placeholder="Describe student strengths and positive growth in writing skills..."></textarea>
                <!-- What the printer gets instead of the box. Kept in step with
                     the box by renderPrintCopies(). -->
                <div class="print-copy" id="strengthsPrint"></div>
            </div>
            <div class="comment-box">
                <h3>Stretches: Areas of Growth</h3>
                <textarea id="stretches" placeholder="Identify areas where the student is working toward growth..."></textarea>
                <div class="print-copy" id="stretchesPrint"></div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-sample" id="sampleBtn" onclick="toggleSample()">Try it with a sample student</button>
            <button class="btn btn-primary" onclick="exportPDF()">Export as PDF</button>
            <button class="btn btn-primary" onclick="exportCSV()">Export as CSV</button>
            <button class="btn btn-secondary" onclick="window.print()">Print</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear this assessment</button>
        </div>
        <div class="undo-row">
            <button class="btn" id="undoBtn" onclick="undoClear()">Undo clear</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <!-- role="dialog" + aria-modal, and the keyboard is held inside it by
             the Tab handler below. It used to be a plain div: Tab walked
             straight out onto the score buttons hidden under the dark overlay,
             and Enter there changed a score nobody could see. -->
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle" tabindex="-1">Skills</h2>
            </div>
            <div class="modal-body">
                <div class="modal-skills" id="modalSkills"></div>
            </div>
            <div class="modal-footer">
                <button class="close-btn" id="modalCloseBtn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const skills = [
            { id: 0, label: "Demonstrates curiosity and engagement" },
            { id: 1, label: "Prints using upper and lower case letters" },
            { id: 2, label: "Writes complete and detailed sentences" },
            { id: 3, label: "Applies grammar and punctuation to their writing" },
            { id: 4, label: "Spells words correctly that mirror learned patterns" },
            { id: 5, label: "Writes narrative, opinion, and explanatory pieces" },
            { id: 6, label: "Revises and edits with guidance" }
        ];

        let scores = {};
        let comments = { strengths: '', stretches: '' };
        let isSample = false;
        let lastCleared = null;   // one step of undo for anything that empties the sheet
        let sampleCleared = false; // she does not walk back in once she has been sent away
        // Which skill rows still hold the score Maya arrived with. This is how
        // the tool can tell "the teacher happened to also mark row 3 Emerging"
        // from "row 3 is still Maya's". See leaveSampleIfGone().
        let sampleScoreKeys = [];
        // Set once a record has been read back off this laptop, so init() knows
        // the difference between "no date has ever been set" (fill in today) and
        // "the teacher deliberately emptied the date box" (leave it empty).
        let hadSavedRecord = false;
        // Another tab of this same tool has saved something. See the storage
        // listener at the bottom.
        let otherTabSaved = false;
        // Which band the open panel is describing, so it can be rebuilt when the
        // scores underneath it change.
        let modalBand = null;
        let modalOpener = null;   // where to put the keyboard back when it closes

        const colors = {
            e: '#378ADD',
            d: '#BA7517',
            m: '#639922'
        };
        const bandName = { e: 'Emerging', d: 'Developing', m: 'Mastered' };

        // Storage keys live in one place so the tests can read them off the page
        // instead of guessing at a string that might have been renamed.
        //
        // WHAT WAS WRONG: the sheet used to be written as three separate keys in
        // one try/catch. A browser that starts refusing writes part way through
        // — a disk filling up while a teacher works — accepted the scores and
        // then refused the comments, so storage kept this week's scores sitting
        // next to last week's comments and reopened the mixture with no warning
        // at all. One key is one write: it either lands whole or not at all.
        const K_RECORD   = 'writingRecord';
        // The three keys the tool used to write. Read once, on the next opening
        // after this change, so nobody's saved assessment is lost in the move,
        // then cleared away.
        const K_SCORES   = 'writingScores';
        const K_COMMENTS = 'writingComments';
        const K_WHO      = 'writingWho';
        // The one step of Undo is saved too. It used to live only in a variable,
        // so "Undo clear brings it straight back" stopped being true the moment
        // the tab was refreshed — and by then storage had already been emptied.
        const K_UNDO     = 'writingUndo';

        // The sample child. She is the same Maya Torres in every tool in this
        // portfolio, and her profile is deliberately mixed — a child who scores
        // the same on everything shows a visitor nothing about the tool.
        const SAMPLE = {
            initials: 'M.T.',
            scores: { 0: 'm', 1: 'm', 2: 'd', 3: 'e', 4: 'd', 5: 'e', 6: 'm' },
            strengths: 'Maya comes to writing time with plenty to say and starts without being asked. Her printing is clear and she keeps upper and lower case apart on her own now. She reads her writing back to herself and often adds a detail while she is doing it.',
            stretches: 'Most pieces are one long sentence held together with "and", so full stops and capitals come and go. Short a and short i words are solid; anything with a vowel team is still a guess. Next step is saying one sentence out loud, writing that sentence, then saying the next.'
        };

        // ------------------------------------------------------------------
        // Messages. Never "Error:" — say what happened and what to do next.
        // ------------------------------------------------------------------
        // WHAT WAS WRONG, TWICE OVER:
        //  1. every call left its own timer running, so the timer belonging to
        //     an EARLIER showing of the same sentence wiped a later one off the
        //     screen before its own time was up — a confirmation that vanished
        //     while the teacher was still reading it. A token fixes it: only the
        //     newest message may clear the line.
        //  2. a warning that matters ("this is not being saved") was overwritten
        //     a millisecond later by a friendly one, because every message had
        //     the same weight. A warning now holds the line until it expires.
        let sayToken = 0;
        let warningUntil = 0;
        function say(msg, ms, isWarning) {
            const m = document.getElementById('savedmsg');
            if (!m) return;
            if (!isWarning && Date.now() < warningUntil) return;  // do not talk over a warning
            const mine = ++sayToken;
            if (isWarning) warningUntil = Date.now() + (ms || 6000);
            m.textContent = msg;
            setTimeout(() => {
                if (sayToken !== mine) return;
                m.textContent = '';
                if (isWarning) warningUntil = 0;
            }, ms || 6000);
        }

        // A warning about saving, said the same way everywhere it is needed.
        function sayNotSaved() {
            say('THIS ASSESSMENT IS NOT BEING SAVED — this browser refused to store it ' +
                '(private window, or the disk is full). Print or export before you close this tab.',
                60000, true);
        }

        function todayISO() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        // WHAT WAS WRONG: four places read the date box directly and each made up
        // its own mind about a date the tool could not use. A five-digit year —
        // one extra keypress in Chrome's year segment — was shown on screen,
        // written into the CSV, printed on the PDF and put in both filenames,
        // and then silently replaced with today on the next reload, so one saved
        // record gave four different answers to "when?". Everything reads the
        // date through here now, so the screen, both exports, both filenames and
        // what comes back after a refresh always agree.
        function dateValue() {
            const raw = document.getElementById('wdate').value;
            return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : '';
        }

        // What a date the tool cannot use looks like on screen, on paper and in
        // the exports: nothing, said out loud, rather than today quietly.
        const NO_DATE = 'no date';

        // Initialize
        function init() {
            loadFromStorage();
            // WHAT WAS WRONG: this filled in today whenever the box was empty,
            // including on a saved record whose date the teacher had deliberately
            // emptied — so a blank date came back as today on the next opening
            // while the CSV made minutes earlier still had it blank. Today is
            // only filled in when no record has ever been saved here.
            if (!hadSavedRecord && !document.getElementById('wdate').value) {
                document.getElementById('wdate').value = todayISO();
            }
            // WHAT WAS WRONG: a first visit was a blank grey ring, empty boxes
            // and 0/0/0 — nothing on screen showed what the tool does until the
            // visitor thought to press a button. A cold, empty arrival now
            // starts on the sample child, exactly as the phonics tool does. She
            // is labelled everywhere she appears and one click sends her away
            // for good. Nobody's work can be standing on the page at this point:
            // this only runs when storage is untouched.
            if (firstVisit()) {
                loadSample();
                // The way out of the sample is a button inside the orange banner
                // now, not a sentence naming a button a thousand pixels below
                // the fold that then deletes itself after ten seconds.
                say('This is Maya Torres, a made-up sample, so there is something to look at. ' +
                    'The button in the orange line above clears her.', 10000);
            }
            renderSkills();
            renderComments();
            renderSample();
            renderUndo();
            updateChart();
            renderPrintHeader();
        }

        function firstVisit() {
            if (sampleCleared || hasWork()) return false;
            try {
                return [K_RECORD, K_SCORES, K_COMMENTS, K_WHO, K_UNDO]
                    .every(k => localStorage.getItem(k) === null);
            } catch (err) {
                return false;   // a browser that will not remember gets the empty sheet
            }
        }

        // Is there anything on this page a person would be sorry to lose?
        // The date counts. It used to be invisible here, so a teacher who set
        // the date and nothing else was told "there is nothing to clear yet",
        // and both sample paths overwrote it with today asking nothing.
        function hasWork() {
            const d = dateValue();
            return Object.keys(scores).length > 0 ||
                   document.getElementById('initials').value.trim() !== '' ||
                   document.getElementById('strengths').value.trim() !== '' ||
                   document.getElementById('stretches').value.trim() !== '' ||
                   (d !== '' && d !== todayISO());
        }

        function renderSkills() {
            const skillsList = document.getElementById('skillsList');

            // WHAT WAS WRONG: scoring rebuilds every row, which destroyed the
            // button the keyboard was sitting on and threw focus back to the top
            // of the page. Scoring by keyboard meant tabbing in again from the
            // top for every skill, and "press the same letter again to clear it"
            // could not be done at all. Remember which button was focused and
            // put the keyboard back on its replacement.
            const active = document.activeElement;
            const wasFocused = active && active.dataset ? active.dataset.focuskey : null;

            skillsList.innerHTML = '';

            skills.forEach(skill => {
                const skillItem = document.createElement('div');
                skillItem.className = 'skill-item';

                const score = scores[skill.id] || null;
                let borderColor = '#ddd';
                if (score === 'e') borderColor = '#378ADD';
                else if (score === 'd') borderColor = '#BA7517';
                else if (score === 'm') borderColor = '#639922';
                skillItem.style.borderLeftColor = borderColor;

                // The × is ALWAYS in the row — merely invisible when there is
                // nothing to clear. See the .clear-score.empty comment in the
                // stylesheet: it used to appear and disappear, which shoved
                // E, D and M sideways under a finger that was already moving.
                const clearBtn =
                    `<button class="clear-score${score ? '' : ' empty'}" ` +
                    `title="Clear this score" aria-label="Clear the score for ${esc(skill.label)}" ` +
                    `data-focuskey="s${skill.id}-x" ${score ? '' : 'tabindex="-1" aria-hidden="true"'} ` +
                    `onclick="clearScore(${skill.id})">&times;</button>`;

                // Each letter says its whole word and which skill it belongs to,
                // and says whether it is the one currently chosen. On screen it
                // was a bare "E" with nothing anywhere explaining what E meant.
                const btn = (band, letter) =>
                    `<button class="score-btn ${score === band ? band : ''}" ` +
                    `data-focuskey="s${skill.id}-${band}" ` +
                    `aria-pressed="${score === band ? 'true' : 'false'}" ` +
                    `aria-label="${bandName[band]} — ${esc(skill.label)}" ` +
                    `onclick="setScore(${skill.id}, '${band}')">${letter}</button>`;

                skillItem.innerHTML = `
                    <span class="skill-label">${esc(skill.label)}</span>
                    <div class="skill-buttons">
                        ${btn('e', 'E')}
                        ${btn('d', 'D')}
                        ${btn('m', 'M')}
                        ${clearBtn}
                    </div>
                `;
                skillsList.appendChild(skillItem);
            });

            if (wasFocused) {
                // The little x is only usable while a row is scored, so when it
                // is the thing that just went invisible, hand the keyboard to
                // that row's first letter rather than dropping it on the floor.
                let back = skillsList.querySelector('[data-focuskey="' + wasFocused + '"]');
                if (back && back.classList.contains('empty')) back = null;
                if (!back) {
                    back = skillsList.querySelector('[data-focuskey^="' + wasFocused.split('-')[0] + '-"]');
                }
                if (back) back.focus();
            }
        }

        function setScore(skillId, score) {
            if (scores[skillId] === score) delete scores[skillId];
            else scores[skillId] = score;
            // This row is the teacher's now, whatever it used to be.
            sampleScoreKeys = sampleScoreKeys.filter(k => k !== String(skillId));
            afterEdit();
        }

        function clearScore(skillId) {
            delete scores[skillId];
            sampleScoreKeys = sampleScoreKeys.filter(k => k !== String(skillId));
            afterEdit();
        }

        // Everything that changes the sheet ends here.
        //
        // WHAT WAS WRONG: this used to call dropUndo(). After the sample was
        // dropped over a real assessment, that assessment existed ONLY inside
        // the saved undo — and the very first thing anybody does on the page,
        // one click on a score button or one character typed in a box, deleted
        // it. The Undo button silently disappeared and twenty minutes of
        // observation was gone with nothing asked and nothing said. The offer is
        // kept now; undoClear() asks before it replaces anything, so a stale
        // offer can no longer throw away newer work either.
        function afterEdit() {
            leaveSampleIfGone();
            saveToStorage();
            renderSkills();
            updateChart();
            renderModal();
            renderPrintHeader();
            // WHAT WAS WRONG: renderSample() was missing here, and setScore()
            // and clearScore() both come through this function. Only typing in
            // one of the text boxes redrew the banner, so a teacher who typed
            // their own child over Maya and then started scoring was left with
            // the count from before they scored anything — "Still hers: 7 of
            // her scores" while three were hers — on screen and, because the
            // same line is what prints, on the paper copy too. That sentence is
            // the one line telling a teacher which parts of the sheet are made
            // up, so it has to be redrawn by every edit, not by some of them.
            renderSample();
        }

        // Count by walking the seven skills, not by walking whatever happens to
        // be sitting in `scores`. Counting the object's own values meant a saved
        // score for a skill that does not exist — id 9, left behind by an older
        // version of this list, or a hand-edited file — was added to the totals
        // and to "n of 7 skills scored" while no row on screen showed it.
        function counts() {
            const c = { e: 0, d: 0, m: 0 };
            skills.forEach(skill => {
                const v = scores[skill.id];
                if (v === 'e' || v === 'd' || v === 'm') c[v]++;
            });
            return c;
        }

        function updateChart() {
            const c = counts();

            document.getElementById('numEmerging').textContent = c.e;
            document.getElementById('numDeveloping').textContent = c.d;
            document.getElementById('numMastered').textContent = c.m;

            const scored = c.e + c.d + c.m;
            const note = document.getElementById('chartNote');
            note.textContent = scored === 0
                ? 'Nothing scored yet — use E, D or M beside a skill.'
                : scored + ' of ' + skills.length + ' skills scored';

            drawPie({
                e: (c.e / skills.length) * 360,
                d: (c.d / skills.length) * 360,
                m: (c.m / skills.length) * 360
            });
        }

        function drawPie(angles) {
            const svg = document.getElementById('pieChart');
            const c = counts();          // for the name each slice reads out
            svg.innerHTML = '';

            const centerX = 100, centerY = 100, radius = 80;
            let currentAngle = -90;

            const slices = [
                { angle: angles.e, color: colors.e, score: 'e' },
                { angle: angles.d, color: colors.d, score: 'd' },
                { angle: angles.m, color: colors.m, score: 'm' }
            ];

            // An empty chart used to be a blank square: the white centre circle
            // on a white-ish panel and nothing else. Draw the ring in grey so a
            // visitor sees what the chart IS before any score exists.
            //
            // WHAT WAS WRONG: this grey ring was drawn ONLY while nothing was
            // scored, so the moment the first skill was tapped the unscored
            // share stopped being drawn at all — from the first tap to the
            // seventh the chart was a broken-looking fragment of a circle while
            // the line under it said "1 of 7 skills scored". The whole circle is
            // always seven skills; the grey is the part not yet assessed.
            const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            ring.setAttribute('cx', centerX);
            ring.setAttribute('cy', centerY);
            ring.setAttribute('r', radius);
            ring.setAttribute('fill', '#E0DCD4');
            svg.appendChild(ring);

            slices.forEach(slice => {
                if (slice.angle <= 0) return;

                let shape;
                if (slice.angle >= 359.9) {
                    // THE BUG THIS GUARDS: score every skill the same way — the
                    // first thing most people try — and the slice is a 360°
                    // arc whose start point and end point are identical. SVG
                    // draws that as a hairline, so the whole chart went blank
                    // while the legend said "Mastered 7". A full circle has to
                    // be drawn as a circle, not as an arc.
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    shape.setAttribute('cx', centerX);
                    shape.setAttribute('cy', centerY);
                    shape.setAttribute('r', radius);
                } else {
                    const startAngle = (currentAngle * Math.PI) / 180;
                    const endAngle = ((currentAngle + slice.angle) * Math.PI) / 180;

                    const x1 = centerX + radius * Math.cos(startAngle);
                    const y1 = centerY + radius * Math.sin(startAngle);
                    const x2 = centerX + radius * Math.cos(endAngle);
                    const y2 = centerY + radius * Math.sin(endAngle);

                    const largeArc = slice.angle > 180 ? 1 : 0;

                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    shape.setAttribute(
                        'd',
                        `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`
                    );
                }

                shape.setAttribute('fill', slice.color);
                shape.setAttribute('stroke', 'white');
                shape.setAttribute('stroke-width', '2');
                shape.style.cursor = 'pointer';
                shape.onclick = () => openModal(slice.score);

                // A slice opens the list of skills, so it is a button and has to
                // behave like one. It used to be mouse-only: no tabindex, no
                // role, no name read out. The three count tiles below the chart
                // do the same job, so this was a lost shortcut rather than a
                // dead end, but a shortcut only some people can use is not one.
                const n = c[slice.score];
                shape.setAttribute('tabindex', '0');
                shape.setAttribute('role', 'button');
                shape.setAttribute('aria-label',
                    bandName[slice.score] + ' — ' + n + ' of ' + skills.length +
                    ' skills. Open the list.');
                shape.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        openModal(slice.score);
                    }
                };
                svg.appendChild(shape);

                currentAngle += slice.angle;
            });

            // Center circle for donut effect
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', centerX);
            circle.setAttribute('cy', centerY);
            circle.setAttribute('r', 50);
            circle.setAttribute('fill', 'white');
            svg.appendChild(circle);
        }

        function openModal(score) {
            // Remember where the keyboard came from, so Close can put it back.
            modalOpener = document.activeElement;
            modalBand = score;
            renderModal();
            document.getElementById('modal').style.display = 'block';
            // WHAT WAS WRONG: opening the panel left the keyboard outside it.
            // Tab walked straight onto the score buttons under the 50%-black
            // overlay, and Enter there changed a score nobody could see while
            // the open panel went on describing the sheet from before.
            document.getElementById('modalTitle').focus();
        }

        // The panel is rebuilt from the live scores every time anything changes
        // underneath it. It used to be drawn once and then left: score a skill
        // or clear the whole sheet with the panel open and it went on listing a
        // record that no longer existed.
        function renderModal() {
            if (!modalBand) return;
            const score = modalBand;
            const filtered = skills.filter(s => scores[s.id] === score);

            document.getElementById('modalTitle').textContent = bandName[score] + ' Skills';
            const modalSkills = document.getElementById('modalSkills');

            // A blocking alert() used to fire here when a band was empty, which
            // is also why the three count tiles looked dead — they had no
            // handler at all. Both now open this same panel and it says plainly
            // that the band is empty.
            if (filtered.length === 0) {
                modalSkills.innerHTML = '<div class="modal-empty">No skills are marked ' +
                    bandName[score] + ' yet.</div>';
            } else {
                modalSkills.innerHTML = filtered
                    .map(s => `<div class="modal-skill">${esc(s.label)}</div>`)
                    .join('');
            }

            // Color the left border
            document.querySelector('.modal-header').style.borderLeftColor = colors[score];
        }

        function modalIsOpen() {
            return document.getElementById('modal').style.display === 'block';
        }

        function closeModal() {
            if (!modalIsOpen()) return;
            document.getElementById('modal').style.display = 'none';
            modalBand = null;
            // WHAT WAS WRONG: closing with the panel's own Close button left the
            // keyboard on an element that was now hidden, so the next Tab
            // restarted at the top of the page.
            const back = modalOpener;
            modalOpener = null;
            if (back && document.contains(back) && back.focus) {
                try { back.focus(); } catch (e) { /* it went away while open */ }
            }
        }

        // Hold the keyboard inside the panel while it is open. Without this,
        // Tab was walking out behind the overlay.
        function trapTab(e) {
            if (e.key !== 'Tab' || !modalIsOpen()) return;
            const content = document.querySelector('.modal-content');
            const stops = Array.prototype.slice.call(
                content.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
            if (!stops.length) return;
            const first = stops[0], last = stops[stops.length - 1];
            const here = document.activeElement;
            if (e.shiftKey && (here === first || !content.contains(here))) {
                e.preventDefault(); last.focus();
            } else if (!e.shiftKey && (here === last || !content.contains(here))) {
                e.preventDefault(); first.focus();
            }
        }

        function renderComments() {
            document.getElementById('strengths').value = comments.strengths;
            document.getElementById('stretches').value = comments.stretches;
            renderPrintCopies();
        }

        // The paper copy of both comment boxes. See the print rules in the
        // stylesheet: on paper the box is hidden and this plain text is what
        // gets printed, because a textarea only prints the part that fits.
        function renderPrintCopies() {
            document.getElementById('strengthsPrint').textContent =
                document.getElementById('strengths').value;
            document.getElementById('stretchesPrint').textContent =
                document.getElementById('stretches').value;
        }

        function renderSample() {
            document.getElementById('sampleFlag').style.display = isSample ? 'block' : 'none';
            document.getElementById('sampleBtn').textContent = isSample
                ? 'Clear the sample student'
                : 'Try it with a sample student';
            // While the sheet is still exactly Maya's the banner says so plainly.
            // Once a teacher has typed some of their own work over the top, it
            // says which parts are still hers, so a half-and-half sheet is never
            // exported as though the whole thing were made up.
            document.getElementById('sampleFlagText').textContent = sampleUntouched()
                ? 'Sample student — Maya Torres (example data, not a real child)'
                : 'Part sample — some of this is still Maya Torres, the made-up example. ' +
                  'Still hers: ' + sampleTraceParts().join(', ') + '.';
        }

        // The plain-text stand-ins for the two header boxes, and the line that
        // identifies the second printed sheet. Kept in step with the screen.
        function renderPrintHeader() {
            const ini = (document.getElementById('initials').value || '').toUpperCase();
            const d = dateValue();
            // Blank really is blank. A stand-in left empty is styled on paper as
            // a ruled line beside its label, so a sheet printed to be filled in
            // by hand has somewhere to write instead of the tool's own "—" and
            // "no date" already sitting in the space.
            document.getElementById('initialsPrint').textContent = ini;
            document.getElementById('datePrint').textContent = d;
            // Sheet 2's line is a sentence, not a form field, so its empty spaces
            // are drawn with a rule of underscores rather than a CSS border.
            const BLANK = '__________';
            document.getElementById('sheetTwoId').textContent =
                'Writing Assessment — Child: ' + (isSample ? 'Sample student, Maya Torres (' + (ini || BLANK) + ')' : (ini || BLANK)) +
                ' — Date: ' + (d || BLANK) +
                (isSample ? ' — SAMPLE, not a real child' : '');
        }

        // ------------------------------------------------------------------
        // Saving. Every localStorage call is wrapped: a full disk and Safari's
        // private window both throw, and a silent failure here loses a whole
        // assessment without the teacher ever being told.
        // ------------------------------------------------------------------
        // Returns true only if the record really reached the disk. Callers that
        // tell the teacher something has happened have to know: "Assessment
        // cleared" used to be said over the top of a browser that had refused
        // the write, so the record was still there and came back on the next
        // reload with the Undo button gone.
        function saveToStorage() {
            comments.strengths = document.getElementById('strengths').value;
            comments.stretches = document.getElementById('stretches').value;
            renderPrintCopies();
            renderPrintHeader();

            // Another tab of this same tool is the live one. See the storage
            // listener: writing here would put this tab's older sheet over
            // whatever the other tab has just saved, silently.
            if (otherTabSaved) return false;

            // Built first, written second — one setItem, so a browser that
            // starts refusing writes cannot leave half a record behind.
            let payload;
            try {
                payload = JSON.stringify({
                    v: 1,
                    scores: scores,
                    comments: comments,
                    initials: document.getElementById('initials').value,
                    date: dateValue(),
                    sample: isSample,
                    sampleCleared: sampleCleared,
                    sampleScoreKeys: sampleScoreKeys
                });
            } catch (err) { payload = null; }

            if (payload === null) { sayNotSaved(); return false; }

            try {
                localStorage.setItem(K_RECORD, payload);
                lastWritten = payload;
                return true;
            } catch (err) {
                sayNotSaved();
                return false;
            }
        }

        // What this tab last put in storage, so the storage listener can tell
        // "another tab wrote something" from "this tab's own write echoed back".
        let lastWritten = null;

        // ------------------------------------------------------------------
        // What comes back out of storage is not automatically trustworthy. It
        // can be a file half-written when the laptop was closed, something left
        // by an older version of this tool, or a line somebody edited by hand.
        // JSON.parse succeeding only means it is valid JSON — not that it is a
        // score sheet. So everything read back is checked before it is used.
        // ------------------------------------------------------------------
        function cleanScores(raw) {
            const out = {};
            if (!raw || typeof raw !== 'object') return out;
            skills.forEach(skill => {
                const v = raw[skill.id];
                if (v === 'e' || v === 'd' || v === 'm') out[skill.id] = v;
            });
            return out;
        }

        function cleanComments(raw) {
            const out = { strengths: '', stretches: '' };
            if (!raw || typeof raw !== 'object') return out;
            if (typeof raw.strengths === 'string') out.strengths = raw.strengths;
            if (typeof raw.stretches === 'string') out.stretches = raw.stretches;
            return out;
        }

        // A saved Undo is read back with the same suspicion as everything else:
        // anything that is not a whole, sensible snapshot is simply not offered.
        function cleanSnapshot(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const scoresOut = cleanScores(raw.scores);
            const commentsOut = cleanComments(raw.comments);
            const initials = typeof raw.initials === 'string' ? raw.initials.slice(0, 4) : '';
            // Blank stays blank. This used to fall back to today, so pressing
            // Undo in the same session put back the empty date box the teacher
            // had left, while pressing the same Undo after a refresh put back
            // today — one button, two different answers.
            const date = (typeof raw.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.date))
                ? raw.date : '';
            const nothingInIt = Object.keys(scoresOut).length === 0 &&
                                commentsOut.strengths === '' && commentsOut.stretches === '' &&
                                initials === '';
            if (nothingInIt) return null;   // nothing worth putting back
            return {
                scores: scoresOut, comments: commentsOut, initials: initials, date: date,
                sample: raw.sample === true,
                sampleScoreKeys: Array.isArray(raw.sampleScoreKeys)
                    ? raw.sampleScoreKeys.map(String) : [],
                label: typeof raw.label === 'string' && raw.label ? raw.label.slice(0, 60) : 'Undo clear'
            };
        }

        function loadFromStorage() {
            let raw = null, undo = null, legacy = null;
            try {
                raw = localStorage.getItem(K_RECORD);
                undo = localStorage.getItem(K_UNDO);
                if (raw === null) {
                    legacy = {
                        scores: localStorage.getItem(K_SCORES),
                        comments: localStorage.getItem(K_COMMENTS),
                        who: localStorage.getItem(K_WHO)
                    };
                }
            } catch (err) {
                say('This browser will not let the tool remember anything (private window, ' +
                    'or the disk is full). You can still score, print and export — just do not ' +
                    'close the tab before you do.', 60000, true);
                return;
            }

            let rec = null;
            // A half-written record used to throw out of init() and leave the
            // page with no skills rendered at all.
            try { if (raw) rec = JSON.parse(raw); } catch (e) { rec = null; }

            // An assessment saved by the older three-key version of this tool is
            // read once and carried across, so nobody's work is lost in the move.
            if (!rec && legacy && (legacy.scores || legacy.comments || legacy.who)) {
                rec = {};
                try { rec.scores = JSON.parse(legacy.scores); } catch (e) { rec.scores = {}; }
                try { rec.comments = JSON.parse(legacy.comments); } catch (e) { rec.comments = {}; }
                try { Object.assign(rec, JSON.parse(legacy.who) || {}); } catch (e) { /* header lost */ }
            }
            try { localStorage.removeItem(K_SCORES); localStorage.removeItem(K_COMMENTS);
                  localStorage.removeItem(K_WHO); } catch (e) { /* nothing to tidy */ }

            if (rec && typeof rec === 'object') {
                hadSavedRecord = true;
                lastWritten = raw;
                scores = cleanScores(rec.scores);
                comments = cleanComments(rec.comments);

                // Initials: text, and no longer than the box allows anyone to
                // type. A number saved here used to be dropped straight into
                // the box and shown as if a teacher had typed it.
                document.getElementById('initials').value =
                    typeof rec.initials === 'string' ? rec.initials.slice(0, 4) : '';

                // A date the date box cannot show is no date at all.
                document.getElementById('wdate').value =
                    (typeof rec.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(rec.date)) ? rec.date : '';

                // Only a real saved `true` turns the orange sample banner on.
                // Any other truthy value used to light it up with no Maya
                // Torres behind it — a sheet labelled as an example while
                // holding whatever was actually on the page.
                isSample = rec.sample === true;

                // Once the sample has been sent away she stays away, even
                // after a refresh.
                sampleCleared = rec.sampleCleared === true;

                sampleScoreKeys = Array.isArray(rec.sampleScoreKeys)
                    ? rec.sampleScoreKeys.filter(k => typeof k === 'string' || typeof k === 'number')
                                         .map(String)
                    : [];

                // WHAT WAS WRONG: if the part of the saved record holding the
                // sample flag was damaged or missing while the scores and the
                // comments survived, Maya's made-up data stayed on the page with
                // every "sample" marking stripped off it — the orange banner
                // gone, and the CSV going out as a classroom record. Her words
                // are the evidence: if the sheet IS her, it says so, flag or no
                // flag.
                if (!isSample && looksLikeSampleContent()) {
                    isSample = true;
                    sampleScoreKeys = skills.map(s => String(s.id));
                }
            }

            try { if (undo) lastCleared = cleanSnapshot(JSON.parse(undo)); }
            catch (e) { lastCleared = null; }
        }

        // ------------------------------------------------------------------
        // Clearing, and getting it back
        // ------------------------------------------------------------------
        function snapshot(label) {
            return {
                scores: JSON.parse(JSON.stringify(scores)),
                comments: {
                    strengths: document.getElementById('strengths').value,
                    stretches: document.getElementById('stretches').value
                },
                initials: document.getElementById('initials').value,
                date: dateValue(),
                sample: isSample,
                sampleScoreKeys: sampleScoreKeys.slice(),
                label: label || 'Undo clear'
            };
        }

        // Returns whether the emptied sheet actually reached the disk.
        function wipe() {
            scores = {};
            comments = { strengths: '', stretches: '' };
            isSample = false;
            sampleCleared = true;   // an emptied sheet is a teacher's, not Maya's
            sampleScoreKeys = [];
            document.getElementById('initials').value = '';
            document.getElementById('wdate').value = todayISO();
            document.getElementById('strengths').value = '';
            document.getElementById('stretches').value = '';
            const ok = saveToStorage();
            renderSkills();
            renderComments();
            renderSample();
            updateChart();
            // A panel left open over a sheet that has just been emptied went on
            // listing the record that had just been destroyed.
            closeModal();
            return ok;
        }

        function clearAll() {
            // Nothing to clear is not a question worth asking — and an Undo
            // offered over an empty sheet is an offer that means nothing.
            if (!hasWork()) { say('There is nothing to clear yet.', 5000); return; }

            // One click used to destroy the lot with nothing but a bare "Are
            // you sure?" and no way back. Say what goes, and offer the way back.
            if (!confirm('Clear this assessment?\n\nThe scores, both comment boxes, the ' +
                         'initials and the date all go. If you want to keep a copy, cancel ' +
                         'and export or print first.\n\nUndo clear brings it straight back.')) return;

            // WHAT WAS WRONG: this always took a snapshot of whatever was on
            // screen. If the sample had been loaded over a real assessment, the
            // real assessment was sitting in the owed Undo — and clearing the
            // sample overwrote that Undo with a snapshot of Maya, so "Undo clear
            // brings it straight back" brought Maya back and the teacher's own
            // twenty minutes existed nowhere. The sample-button path already
            // guarded this; Clear did not. Now both do.
            const owed = (lastCleared && sampleUntouched()) ? lastCleared : null;
            const keep = owed || snapshot('Undo clear');

            const ok = wipe();
            const undoSaved = offerUndo(keep);

            if (!ok) {
                // The browser refused the write, so nothing was really cleared —
                // and a reload would bring the child straight back. Say that,
                // rather than "Assessment cleared".
                say('This browser would not let the tool save, so the sheet on screen is empty ' +
                    'but the saved copy is still there — reloading brings it back. Print or ' +
                    'export what you need, then close the tab.', 60000, true);
                return;
            }
            say('Assessment cleared. ' + (undoSaved
                ? 'Press Undo clear if that was not what you meant.'
                : 'Undo clear works while this tab stays open — this browser would not let the ' +
                  'tool save the way back, so do not reload until you are sure.'), 20000);
        }

        function undoClear() {
            if (!lastCleared) return;

            // WHAT WAS WRONG: this replaced whatever was on screen with no
            // question at all. Because edits no longer silently spend the Undo,
            // the offer can now be standing over live work — a hand-edited file,
            // or a second tab — and one click would have thrown that work away
            // with no second way back. It asks, and what it replaces is itself
            // offered back.
            const replacing = hasWork() ? snapshot('Undo — put back what was on screen') : null;
            if (replacing && !confirm('Put the earlier assessment back?\n\nWhat is on this page ' +
                    'now — the scores, both comment boxes, the initials and the date — is ' +
                    'replaced by it.\n\nOne more Undo brings this page back.')) return;

            scores = lastCleared.scores;
            comments = lastCleared.comments;
            isSample = lastCleared.sample;
            sampleScoreKeys = lastCleared.sampleScoreKeys || [];
            document.getElementById('initials').value = lastCleared.initials;
            document.getElementById('wdate').value = lastCleared.date;
            renderComments();
            leaveSampleIfGone();
            renderSample();
            renderSkills();
            updateChart();
            renderModal();
            saveToStorage();

            if (replacing) offerUndo(replacing); else dropUndo();
            say('Brought back.', 4000);
        }

        // Hold one step of Undo, and hold it in storage as well as in memory.
        // WHAT WAS WRONG: it lived only in a variable while wipe() had already
        // emptied storage, so a refresh — the very thing somebody does when a
        // page looks wrong — turned "Undo clear brings it straight back" into a
        // lie with nothing left behind it.
        // Returns whether the way back really reached the disk, so the caller can
        // tell the truth about it. WHAT WAS WRONG: when storage was near its cap
        // this quietly failed, the Undo button appeared anyway and the message
        // repeated the promise — and one refresh lost the whole assessment.
        function offerUndo(snap) {
            lastCleared = snap;
            renderUndo();
            try { localStorage.setItem(K_UNDO, JSON.stringify(snap)); return true; }
            catch (err) { return false; }   // still works while this tab stays open
        }

        function dropUndo() {
            lastCleared = null;
            try { localStorage.removeItem(K_UNDO); } catch (err) { /* nothing to remove */ }
            renderUndo();
        }

        function renderUndo() {
            const btn = document.getElementById('undoBtn');
            const hiding = !lastCleared && btn.style.display !== 'none';
            // WHAT WAS WRONG: the button was hidden while the keyboard was still
            // sitting on it, so focus was left on an invisible control and the
            // next Tab jumped back to the first field on the page.
            if (hiding && document.activeElement === btn) {
                const back = document.getElementById('sampleBtn');
                if (back) back.focus();
            }
            btn.style.display = lastCleared ? 'inline-block' : 'none';
            btn.textContent = lastCleared ? lastCleared.label : 'Undo clear';
        }

        // ------------------------------------------------------------------
        // The sample student
        // ------------------------------------------------------------------
        // Is what is on screen still exactly Maya, untouched? Clearing her own
        // made-up scores costs nobody anything; clearing what a teacher has
        // typed over the top of them is a different matter.
        function sampleUntouched() {
            return isSample &&
                document.getElementById('initials').value === SAMPLE.initials &&
                dateValue() === todayISO() &&
                document.getElementById('strengths').value === SAMPLE.strengths &&
                document.getElementById('stretches').value === SAMPLE.stretches &&
                skills.every(s => scores[s.id] === SAMPLE.scores[s.id]);
        }

        // Is the sheet Maya's by its contents alone, with no flag to go on? Used
        // as a safety net when the saved flag is damaged or missing.
        function looksLikeSampleContent() {
            return comments.strengths === SAMPLE.strengths &&
                   comments.stretches === SAMPLE.stretches &&
                   skills.every(s => scores[s.id] === SAMPLE.scores[s.id]);
        }

        // Which skill rows are still holding the score Maya arrived with. A row

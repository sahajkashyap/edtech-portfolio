        // the teacher has since touched drops out of sampleScoreKeys, so a
        // teacher who happens to also mark row 3 Emerging does not keep the
        // sheet branded a sample by coincidence.
        function liveSampleScoreKeys() {
            return sampleScoreKeys.filter(k => scores[k] === SAMPLE.scores[k]);
        }

        // The parts of Maya still on the page, named the way a teacher would.
        function sampleTraceParts() {
            const parts = [];
            const n = liveSampleScoreKeys().length;
            if (n) parts.push(n === 1 ? 'one of her scores' : n + ' of her scores');
            if (document.getElementById('initials').value === SAMPLE.initials) parts.push('her initials');
            if (document.getElementById('strengths').value === SAMPLE.strengths) parts.push('her strengths');
            if (document.getElementById('stretches').value === SAMPLE.stretches) parts.push('her stretches');
            return parts;
        }

        // THE WORST DEFECT THIS FILE HAS HAD, AND WHAT FIXES IT:
        // the sample flag was only ever turned off by wipe(). A teacher who
        // arrived on the sample and simply typed their own child over the top —
        // which is exactly what the Child box is built to invite — kept
        // sample:true forever. A genuine assessment was shown under the orange
        // banner, exported as writing-assessment-SAMPLE-….csv, and stamped
        // "SAMPLE — not a real child" inside the file. Every way out ran through
        // wipe(), so the only exit from the SAMPLE state was destroying the
        // work and typing it in again.
        //
        // Now: the moment nothing of Maya's is left on the page — no score she
        // loaded, not her initials, neither of her comment boxes — the sheet
        // stops being a sample and says so.
        function leaveSampleIfGone() {
            if (!isSample) return false;
            if (sampleTraceParts().length > 0) return false;
            isSample = false;
            sampleCleared = true;
            sampleScoreKeys = [];
            renderSample();
            say('Nothing of the sample is left on this sheet, so the example label has come off. ' +
                'This is your own assessment now.', 8000);
            return true;
        }

        // Fill the sheet in with the sample child. Nothing here asks anything —
        // every caller has already decided it is safe.
        function loadSample() {
            scores = Object.assign({}, SAMPLE.scores);
            comments = { strengths: SAMPLE.strengths, stretches: SAMPLE.stretches };
            isSample = true;
            sampleScoreKeys = skills.map(s => String(s.id));
            document.getElementById('initials').value = SAMPLE.initials;
            document.getElementById('wdate').value = todayISO();
            renderComments();
            renderSample();
            renderSkills();
            updateChart();
            renderModal();
            saveToStorage();
        }

        function toggleSample() {
            if (isSample) {
                // Clearing Maya while the sheet is still hers costs nobody
                // anything. Clearing a sheet somebody has typed over the top of
                // her is their own writing going, so that path asks first and
                // keeps one step back, exactly as Clear does.
                if (sampleUntouched()) {
                    // If the sample was loaded over somebody's assessment, that
                    // assessment is still owed its way back — clearing Maya must
                    // not be what finally destroys it.
                    const owed = lastCleared;
                    wipe();
                    if (owed) offerUndo(owed); else dropUndo();
                    // WHAT WAS WRONG: this was the one clear path that never
                    // mentioned Undo, so a teacher whose own assessment was
                    // being held in the Undo buffer was told the tool was simply
                    // "empty and ready" with no hint that their work was one
                    // click away.
                    say(owed
                        ? 'Sample cleared. Your own assessment is one press of "' + owed.label + '" away.'
                        : 'Sample cleared. The tool is empty and ready for your own assessment.', 8000);
                    return;
                }
                if (!confirm('Clear the sample student?\n\nWhat has been typed in over Maya goes ' +
                             'with her — the scores, both comment boxes and the initials. If you ' +
                             'want to keep a copy, cancel and export or print first.\n\n' +
                             'Undo brings it straight back.')) return;
                const keep = snapshot('Undo — put my assessment back');
                wipe();
                offerUndo(keep);
                say('Sample cleared. Press Undo if that was not what you meant.', 20000);
                return;
            }

            // WHAT WAS WRONG, AND IT WAS THE WORST THING IN THIS FILE: this is
            // the friendliest-looking button on the page, and one click on it
            // dropped Maya straight over a real assessment — no question asked,
            // no Undo offered, and the saved copy in storage overwritten too, so
            // a teacher's twenty minutes of observation existed nowhere at all.
            // "Clear this assessment", which is the frightening-looking button,
            // asked first AND offered a way back. This one now does both.
            if (hasWork()) {
                if (!confirm('Load the sample student?\n\nMaya Torres is made up. Her scores and ' +
                             'her comments would go straight over what is on this page now — the ' +
                             'scores, both comment boxes and the initials.\n\n' +
                             'Undo puts your assessment straight back.')) return;
                const keep = snapshot('Undo — put my assessment back');
                loadSample();
                offerUndo(keep);
                say('Filled in with made-up scores for Maya Torres. Press Undo to put your own ' +
                    'assessment back, or press the same button again to clear her.', 20000);
                return;
            }

            // WHAT WAS WRONG: this was `dropUndo(); loadSample();`. Inside the
            // Undo window after a Clear, the cleared assessment lives only in
            // that Undo — and one press of the friendliest button on the page
            // deleted it, asking nothing and warning nothing, while the Clear
            // dialog's promise that "Undo clear brings it straight back" was
            // still on screen. An owed way back survives the sample now, exactly
            // as it survives clearing the sample.
            const owed = lastCleared;
            loadSample();
            if (owed) offerUndo(owed); else dropUndo();
            say('Filled in with made-up scores for Maya Torres. One click on the same button clears her again.' +
                (owed ? ' Your cleared assessment is still one press of "' + owed.label + '" away.' : ''), 8000);
        }

        // ------------------------------------------------------------------
        // Exporting
        // ------------------------------------------------------------------
        function whoLabel() {
            const initials = (document.getElementById('initials').value || '—').toUpperCase();
            return isSample ? 'Sample student — Maya Torres (' + initials + ')' : initials;
        }

        // Initials and the date go in the filename too. Every export used to be
        // called the same thing, so a folder of them told you nothing.
        //
        // Strip FIRST, then fall back. The fallback used to be chosen before the
        // strip, so an empty box gave "noinitials" (the strip ate the hyphen)
        // while a box holding only punctuation gave "no-initials" — two spellings
        // of the same unnamed sheet in one folder.
        function fileStem() {
            // .toUpperCase(): the Child box is styled uppercase, so "jm" LOOKS
            // like "JM" on screen and is written "JM" inside the exported file —
            // but the filename kept the raw lower case, so the same child's
            // sheet came out as writing-assessment-jm-… one day and
            // writing-assessment-JM-… the next with identical contents.
            const typed = document.getElementById('initials').value
                              .replace(/[^A-Za-z0-9.]/g, '').toUpperCase();
            const initials = typed || 'no-initials';
            // The filename used to say today whenever the box was blank, while
            // the CSV's own Date column said nothing — two files about one
            // assessment disagreeing about when it happened.
            const date = dateValue() || 'no-date';
            return 'writing-assessment-' + (isSample ? 'SAMPLE-' : '') +
                   initials + '-' + date;
        }

        // Anything dropped into innerHTML goes through here first.
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // WHAT WAS WRONG: jsPDF's built-in fonts only know the first 256
        // characters, and it does not say so — one arrow, tick or emoji pasted
        // into a comment box turned that whole LINE of the exported PDF into
        // spaced-out gibberish and could run it off the right edge of the paper,
        // while the screen, the printed page and the CSV all carried the same
        // sentence perfectly. The common typing gets swapped for its plain
        // equivalent; anything else becomes a question mark, which is at least
        // honest about what happened.
        const PDF_SWAPS = {
            '‘': "'", '’': "'", '“': '"', '”': '"',
            '–': '-', '—': '-', '…': '...', '•': '-',
            '→': '->', '←': '<-', '✓': 'yes', '✗': 'no',
            ' ': ' ', '​': ''
        };
        function pdfSafe(s) {
            // Everything past 255 is a character the built-in font cannot draw.
            return String(s).replace(/[^\x00-\xFF]/g,
                ch => (ch in PDF_SWAPS) ? PDF_SWAPS[ch] : '?');
        }

        function csvCell(v) {
            v = (v === null || v === undefined) ? '' : String(v);
            return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        }

        function exportCSV() {
            // The comment boxes were being read off a stale copy, so a note
            // typed just before Export was missing from the file. Read the
            // screen first, every time.
            saveToStorage();
            const c = counts();
            const head = ['Child', 'Date', 'Record'].concat(skills.map(s => s.label))
                .concat(['Emerging', 'Developing', 'Mastered', 'Strengths', 'Stretches: Areas of Growth']);
            const row = [
                whoLabel(),
                dateValue(),
                isSample ? 'SAMPLE — not a real child' : 'Classroom record'
            ].concat(skills.map(s => scores[s.id] ? bandName[scores[s.id]] : 'Not assessed'))
             .concat([c.e, c.d, c.m, comments.strengths, comments.stretches]);

            const csv = '﻿' + [head.map(csvCell).join(','), row.map(csvCell).join(',')].join('\r\n');
            const a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = fileStem() + '.csv';
            document.body.appendChild(a); a.click(); a.remove();
            say('Spreadsheet saved as ' + fileStem() + '.csv', 8000);
        }

        function exportPDF() {
            saveToStorage();

            // The PDF maker comes off the internet. Blocked at school, or on a
            // plane, this used to throw into the console and look like a button
            // that simply did nothing.
            if (!window.jspdf || !window.jspdf.jsPDF) {
                say('The PDF maker did not load — this laptop is offline, or the school network ' +
                    'is blocking it. Print (your browser can save the page as a PDF) and Export ' +
                    'as CSV both still work with no internet.', 30000);
                return;
            }

            let doc;
            try {
                const { jsPDF } = window.jspdf;
                doc = new jsPDF();
                const pageHeight = doc.internal.pageSize.getHeight();
                const pageWidth = doc.internal.pageSize.getWidth();
                const BOTTOM = pageHeight - 18;
                let yPos = 15;

                // WHAT WAS WRONG: nothing here ever asked whether there was room
                // left on the page except at the very end of the skills loop. A
                // teacher who wrote two long comments pushed the "Writing Skills
                // Assessment:" heading and the first of the seven skills below
                // the bottom edge of page 1, where jsPDF simply does not draw
                // them — so the exported record quietly lost a skill while the
                // screen, the CSV and the printed sheet all still showed seven.
                // Everything is drawn through these two helpers now, and both
                // start a new page before they run off the paper.
                const room = need => {
                    if (yPos + need > BOTTOM) { doc.addPage(); yPos = 15; return true; }
                    return false;
                };
                const write = (text, size, gap) => {
                    doc.setFontSize(size);
                    const lines = doc.splitTextToSize(pdfSafe(text), pageWidth - 30);
                    const step = size >= 12 ? 6 : 5;
                    lines.forEach(line => {
                        room(step);
                        doc.text(line, 15, yPos);
                        yPos += step;
                    });
                    yPos += (gap || 0);
                };

                // Title
                doc.setFontSize(20);
                doc.text('Writing Assessment', pageWidth / 2, yPos, { align: 'center' });
                yPos += 10;

                // Who and when. A sheet with no child and no date on it cannot
                // be filed, and the sample child has to say so on paper too.
                // The date says what the screen and the CSV say — it used to
                // print today whenever the box was blank, so one assessment
                // produced two export files that disagreed about the date.
                doc.setFontSize(12);
                doc.text(pdfSafe('Child: ' + whoLabel()), 15, yPos);
                doc.text('Date: ' + (dateValue() || NO_DATE), pageWidth - 15, yPos, { align: 'right' });
                yPos += 8;

                if (isSample) {
                    write('This is example data for demonstration. It is not a real child’s record.', 10, 1);
                }

                // Summary Counts
                const c = counts();
                write(`Emerging: ${c.e} | Developing: ${c.d} | Mastered: ${c.m}`, 11, 4);

                write('Strengths:', 12, 0);
                write(document.getElementById('strengths').value || '(No strengths recorded)', 10, 5);

                write('Stretches: Areas of Growth:', 12, 0);
                write(document.getElementById('stretches').value || '(No areas of growth recorded)', 10, 8);

                write('Writing Skills Assessment:', 12, 0);
                skills.forEach(skill => {
                    // 'Not assessed', spelled the way the CSV spells it. The two
                    // export files used to write the same value two ways.
                    const score = scores[skill.id];
                    write(`${skill.label} — ${score ? bandName[score] : 'Not assessed'}`, 10, 1);
                });

                doc.save(fileStem() + '.pdf');
                say('PDF saved as ' + fileStem() + '.pdf', 8000);
            } catch (err) {
                say('The PDF did not get made on this computer. Print (your browser can save ' +
                    'the page as a PDF) and Export as CSV both still work.', 30000);
            }
        }

        // ------------------------------------------------------------------
        // Wiring
        // ------------------------------------------------------------------
        // 'input', not 'change'. On 'change' nothing was written until the box
        // lost focus, so whichever box a teacher typed in last — usually
        // Stretches, the last thing written before closing the tab — was gone
        // after a reload.
        ['strengths', 'stretches', 'initials', 'wdate'].forEach(id =>
            document.getElementById(id).addEventListener('input', () => {
                // No dropUndo() here any more — see afterEdit(). One keystroke
                // used to delete the only copy of a cleared assessment.
                leaveSampleIfGone();
                saveToStorage();
                renderSample();
            }));

        // WHAT WAS WRONG: nothing checked the date on the way in. One extra
        // keypress in Chrome's year segment gives 20261-03-04, and the tool took
        // it: the screen, the saved record, the CSV, the PDF and both filenames
        // all carried it, and then a plain reload silently showed today instead,
        // so the tool and the file it had just made disagreed. Everything reads
        // the date through dateValue() now, and a date the tool cannot use says
        // so out loud instead of being quietly swapped for today.
        document.getElementById('wdate').addEventListener('input', () => {
            const raw = document.getElementById('wdate').value;
            if (raw !== '' && dateValue() === '') {
                say('That date is not one the tool can use — the year has too many digits. ' +
                    'The sheet is saved without a date until it is fixed.', 12000);
            }
        });

        // WHAT WAS WRONG: with the sample loaded, the Child box arrives holding
        // "M.T." — exactly the four characters it allows — so typing over it did
        // nothing at all, and the only way in was to backspace it empty first.
        // Landing in the box while it is still Maya's now selects what is there,
        // so the first letter typed replaces her, which is what anyone expects.
        (function initialsSelectsMayaOnEntry() {
            const box = document.getElementById('initials');
            let selectOnRelease = false;
            const stillMaya = () => isSample && box.value === SAMPLE.initials;
            box.addEventListener('mousedown', () => {
                selectOnRelease = stillMaya() && document.activeElement !== box;
            });
            box.addEventListener('mouseup', (e) => {
                // The click that gives the box focus also puts a caret down,
                // which would undo the selection made on focus. Stop it once.
                if (selectOnRelease) { e.preventDefault(); box.select(); selectOnRelease = false; }
            });
            box.addEventListener('focus', () => { if (stillMaya()) box.select(); });
            // WHAT WAS WRONG: the flag was armed on mousedown and only ever
            // disarmed inside this box's own mouseup. A drag that began in the
            // box and ended outside it left the flag armed for good — and the
            // next mouse-release anywhere over the box, even the end of a
            // text-selection drag started in a comment box, yanked focus in here
            // and the next keystroke overwrote the initials instead of the words
            // that were selected. A release anywhere disarms it.
            window.addEventListener('mouseup', () => { selectOnRelease = false; }, true);
        })();

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('modal');
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            trapTab(e);
        });

        // WHAT WAS WRONG: with the tool open in two tabs, one keystroke in the
        // older tab wrote its whole stale sheet over everything the newer tab
        // had saved — silently, with the older tab still showing a record that
        // no longer existed. A tab that has been overtaken stops saving and says
        // so, rather than quietly winning the race.
        window.addEventListener('storage', (e) => {
            if (e.key !== K_RECORD || e.newValue === null) return;
            if (e.newValue === lastWritten) return;   // our own write echoing back
            otherTabSaved = true;
            say('This assessment is open in another tab, and that tab has just saved a change. ' +
                'To stop the two tabs writing over each other, this tab has stopped saving. ' +
                'Print or export anything here that you need, then close this tab and reload ' +
                'the other one.', 600000, true);
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
